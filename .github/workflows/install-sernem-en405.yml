name: Install approved EN 405 PPE visual
on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-sernem-en405.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install reviewed EN 405 image
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 120 'https://at.adobe.com/mf5L6yYjDewOtyGZ' -o /tmp/en405.png
          python3 -m pip install --quiet --user Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import re
          im=Image.open('/tmp/en405.png').convert('RGB')
          assert im.width>=1000 and im.height>=700
          target=Path('app/public/ppe-standards/approved/en-405.webp')
          target.parent.mkdir(parents=True,exist_ok=True)
          im.save(target,'WEBP',quality=87,method=6)
          assert target.stat().st_size>20000
          p=Path('app/app/[locale]/ppe-standards/visual-data.ts')
          lines=p.read_text().splitlines(keepends=True)
          indices=[i for i,x in enumerate(lines) if x.lstrip().startswith("'EN 405':")]
          assert len(indices)==1
          i=indices[0]
          image="'/ppe-standards/approved/en-405.webp'"
          line,n=re.subn(r"photo:(?:'[^']+'|[0-9]+)","photo:"+image,lines[i],count=1)
          assert n==1
          line,n=re.subn(r"scenes:\[[^\]]*\]","scenes:["+image+"]",line,count=1)
          assert n==1
          line,n=re.subn(r"alt:\{tr:'[^']*',en:'[^']*'\}","alt:{tr:'Gövdeyle bütünleşik filtreli yarım maske; SERNEM özgün temsili HSE görseli, sertifika kanıtı değildir',en:'Integrated-filter half mask; original SERNEM illustrative HSE image, not certification evidence'}",line,count=1)
          assert n==1
          lines[i]=line
          p.write_text(''.join(lines))
          PY
      - name: Commit verified changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/public/ppe-standards/approved/en-405.webp 'app/app/[locale]/ppe-standards/visual-data.ts'
          git diff --cached --quiet && exit 0
          git commit -m 'feat(ppe): deploy approved original EN 405 illustration'
          git push
