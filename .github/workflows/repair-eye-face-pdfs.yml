name: Repair Eye Face Toolbox PDFs

on:
  push:
    branches:
      - chore/toolbox-pdf-qa
    paths:
      - ".github/workflows/repair-eye-face-pdfs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/toolbox-pdf-qa

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install generator dependencies
        run: pip install reportlab pillow svglib

      - name: Compact Eye Face warning without deleting source content
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/scripts/generate-premium-toolbox-batch.py')
          s = p.read_text(encoding='utf-8')
          old = '    warning = supervisor or remember_src or controls[0]\n'
          new = '''    # Eye & Face has a deliberately detailed supervisor script. Using that full\n    # script inside the fixed-height warning panel pushes the checklist onto an\n    # extra page. Keep the full supervisor content in the source model, but use\n    # the concise remember/control text in the warning panel for this topic.\n    warning = (\n        (remember_src or controls[0])\n        if slug == "eye-face-protection"\n        else (supervisor or remember_src or controls[0])\n    )\n'''
          if old not in s:
              raise SystemExit('Expected warning assignment was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Regenerate Eye Face branded-base PDFs
        working-directory: app
        run: |
          python - <<'PY'
          from scripts.generate_premium_toolbox_batch import build
          slug = 'eye-face-protection'
          build('branded', 'en', f'{slug}-toolbox-talk-en-branded-base.pdf', slug=slug)
          build('branded', 'tr', f'{slug}-toolbox-talk-tr-branded-base.pdf', slug=slug)
          PY

      - name: Install Node dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Run full 70-topic PDF QA
        working-directory: app
        run: npm run qa:toolbox-pdfs

      - name: Commit repaired PDFs and generator rule
        run: |
          git config user.name "safebaseapp"
          git config user.email "aslansercann@gmail.com"
          git add app/scripts/generate-premium-toolbox-batch.py \
            app/public/downloads/eye-face-protection-toolbox-talk-en-branded-base.pdf \
            app/public/downloads/eye-face-protection-toolbox-talk-tr-branded-base.pdf
          git diff --cached --quiet && exit 0
          git commit -m "fix: keep eye face branded toolbox to four pages"
          git push origin HEAD:chore/toolbox-pdf-qa
