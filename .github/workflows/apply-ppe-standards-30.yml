  'EN 169':{labelWhere:[T('Legacy kaynak filtre lensindeki ölçek/gölge ve üretici işareti','Scale/shade and manufacturer marking on legacy welding filter')],family:[F('EN 169:2002','Geri çekilmiş kaynak filtresi referansı','Withdrawn welding-filter reference'),F('EN ISO 16321-2','Güncel kaynak koruyucu standardı','Current welding-protector standard')],confused:[C('Legacy EN 169 ≠ yeni sertifikasyon','Legacy EN 169 ≠ new certification','Yeni ürünlerde güncel EN ISO 16321 serisi doğrulanmalıdır.','Current EN ISO 16321 series must be verified for new products.')],wrongChoice:{scenario:T('Eski shade kodunu görüp filtrenin güncel ve işe uygun olduğunu varsaymak.','Assuming a filter is current and task-suitable from a legacy shade code.'),why:T('Standart durumu ve proses parametreleri ayrıca kontrol edilir.','Standard status and process parameters require separate checks.'),better:T('Üretici dokümanı + EN ISO 16321-2 + proses parametrelerini kontrol et.','Check manufacturer documentation, EN ISO 16321-2 and process parameters.')}},
  'EN 170':{labelWhere:[T('Legacy lens üzerindeki UV filtre işareti','UV filter marking on legacy lens')],family:[F('EN 170:2002','Geri çekilmiş UV filtre referansı','Withdrawn UV-filter reference'),F('EN ISO 16321-1:2022+A1:2025','Yeni mesleki göz/yüz korumasının güncel genel referansı','Current general reference for new occupational eye/face protection')],confused:[C('UV filtre ≠ genel güneş gözlüğü','UV filter ≠ ordinary sunglasses','Mesleki koruma gerçek optik ve mekanik tehlikeye göre seçilir.','Occupational protection is selected for actual optical and mechanical hazards.')],wrongChoice:{scenario:T('Sadece koyu lens seçerek UV korumasını doğrulanmış kabul etmek.','Treating a dark lens alone as verified UV protection.'),why:T('Lens rengi tek başına spektral koruma kanıtı değildir.','Lens colour alone is not evidence of spectral protection.'),better:T('Güncel ürün standardını ve üretici spektral performansını doğrula.','Verify current product standard and manufacturer spectral performance.')}},
  'EN 172':{labelWhere:[T('Legacy lens/çerçeve üzerindeki filtre kodu','Filter code on legacy lens/frame')],family:[F('EN 172','Geri çekilmiş endüstriyel sun-glare referansı','Withdrawn industrial sun-glare reference'),F('EN ISO 16321-1','Yeni mesleki koruma için güncel genel referans','Current general reference for new occupational protection')],confused:[C('Güneş gözlüğü ≠ iş güvenliği gözlüğü','Sunglasses ≠ occupational safety eyewear','Parlama azaltımı mekanik ve diğer tehlike korumasının yerine geçmez.','Glare reduction does not replace mechanical or other hazard protection.')],wrongChoice:{scenario:T('Açık sahada sıradan güneş gözlüğünü KKD kabul etmek.','Treating ordinary sunglasses as PPE for outdoor work.'),why:T('Mesleki ürün standardı ve gerekli darbe/optik performans doğrulanmalıdır.','Occupational product standard and required impact/optical performance must be verified.'),better:T('Güncel mesleki standarda uygun koruyucu seç.','Select protection conforming to the current occupational standard.')}},
  'EN 1731':{labelWhere:[T('Legacy mesh siper çerçevesi/taşıyıcısındaki işaret','Marking on legacy mesh visor/frame'),T('Yeni üründe EN ISO 16321-3 işareti','EN ISO 16321-3 marking on new product')],family:[F('EN 1731:2006','Geri çekilmiş mesh koruyucu referansı','Withdrawn mesh-protector reference'),F('EN ISO 16321-3:2022+A1:2026','Güncel mesh koruyucu referansı','Current mesh-protector reference')],confused:[C('Mesh ≠ sıçrama/UV koruması','Mesh ≠ splash/UV protection','Mesh mekanik parçacıklar içindir; açık yapı sıvı ve optik radyasyonu engellemez.','Mesh targets mechanical particles; open structure does not stop liquids or optical radiation.')],wrongChoice:{scenario:T('Taşlama veya kimyasal sıçramada mesh siperi tek koruma olarak kullanmak.','Using a mesh visor alone for grinding or chemical splash.'),why:T('Tehlike mesh kapsamının dışında olabilir.','The hazard may fall outside mesh-protector scope.'),better:T('Gerçek tehlikeye uygun solid visor/gözlük veya kombinasyonu seç.','Select a solid visor/eyewear or combination appropriate to the actual hazard.')}},
  'EN 812':{labelWhere:[T('Başlık içindeki EN 812 ve beden etiketi','EN 812 and size label inside cap')],family:[F('EN 812:2012','Endüstriyel darbe başlıkları','Industrial bump caps'),F('EN 397','Düşen cisim/darbe için endüstriyel baret','Industrial helmet for falling-object/impact hazards')],confused:[C('Bump cap ≠ safety helmet','Bump cap ≠ safety helmet','EN 812 sabit cisimlere baş çarpması için; düşen cisim koruması için değildir.','EN 812 addresses head bumps against stationary objects, not falling-object protection.')],wrongChoice:{scenario:T('Depoda üstten düşen malzeme riski varken bump cap kullanmak.','Using a bump cap where materials can fall from above.'),why:T('EN 812 bu tehlike için baret yerine geçmez.','EN 812 does not replace a safety helmet for this hazard.'),better:T('Düşen cisim riskinde uygun EN 397/işe özel baret gereksinimini doğrula.','Verify appropriate EN 397/task-specific helmet requirement for falling-object risk.')}},
  'EN 12492':{labelWhere:[T('Baret içindeki EN 12492:2025, beden ve üretici işareti','EN 12492:2025, size and manufacturer marking inside helmet')],family:[F('EN 12492:2025','Dağcılık ve benzer faaliyet baretleri','Helmets for mountaineering and similar activities'),F('EN 397','Endüstriyel koruyucu baret; ayrı ürün standardı','Industrial protective helmet; separate product standard')],confused:[C('EN 12492 ≠ otomatik EN 397','EN 12492 ≠ automatic EN 397 equivalence','Bazı ürünler birden çok standardı sağlayabilir, ancak işaret gerçek ürün üzerinde doğrulanır.','Some products may meet multiple standards, but markings must be verified on the actual product.')],wrongChoice:{scenario:T('Çene bağı var diye her climbing tipi bareti endüstriyel baret kabul etmek.','Treating every climbing-style helmet as an industrial helmet because it has a chinstrap.'),why:T('Standart kapsamları ve testleri farklıdır.','Standard scopes and tests differ.'),better:T('Risk değerlendirmesi ve ürün üzerindeki gerçek EN 12492/EN 397 işaretlerini kontrol et.','Check risk assessment and actual EN 12492/EN 397 markings on the product.')}},
  'EN 405':{labelWhere:[T('Maske gövdesindeki EN 405 ve filtre tip/sınıf işareti','EN 405 and filter type/class marking on mask body'),T('Ambalaj/üretici kullanım talimatı','Packaging/manufacturer instructions')],family:[F('EN 405:2001+A1:2009','Entegre gaz veya kombine filtreli valfli yarım maskeler','Valved half masks with integral gas or combined filters'),F('EN 149','Partikül filtreli yarım maskeler; gaz filtresi değildir','Filtering half masks for particles; not gas filters'),F('EN 14387','Değiştirilebilir gaz/kombine filtreler','Replaceable gas/combined filters')],confused:[C('EN 405 ≠ FFP maskesi','EN 405 ≠ FFP mask','Gaz/buhar filtre sınıfı ile partikül FFP sınıfı farklıdır.','Gas/vapour filter class differs from particulate FFP class.')],wrongChoice:{scenario:T('Solvent buharında FFP2 maske kullanmak.','Using an FFP2 mask for solvent vapour.'),why:T('Partikül filtresi gaz/buharı otomatik olarak tutmaz.','A particle filter does not automatically protect against gas/vapour.'),better:T('Kirleticiyi belirle ve uygun EN 405 veya uyumlu gaz filtre sistemini seç.','Identify contaminant and select appropriate EN 405 or compatible gas-filter system.')}},
  'EN 143':{labelWhere:[T('Filtre gövdesindeki EN 143:2021 ve P sınıfı','EN 143:2021 and P class on filter body'),T('Ambalajdaki model/lot/son kullanım bilgisi','Model/lot/expiry information on packaging')],family:[F('EN 143:2021','Değiştirilebilir partikül filtreleri','Replaceable particle filters'),F('EN 14387:2021','Gaz ve kombine filtreler','Gas and combined filters'),F('EN 149','Filtreli yarım maske ürün standardı','Filtering half-mask product standard')],confused:[C('P3 ≠ gaz filtresi','P3 ≠ gas filter','Yüksek partikül sınıfı gaz veya buhar koruması anlamına gelmez.','High particle class does not mean gas or vapour protection.')],wrongChoice:{scenario:T('P3 filtreyi solvent buharında yeterli kabul etmek.','Treating a P3 filter as sufficient for solvent vapour.'),why:T('EN 143 yalnız partikül filtresidir.','EN 143 is a particle-filter standard only.'),better:T('Partikül + gaz/buhar tehlikesinde uygun kombine filtreyi doğrula.','Verify a suitable combined filter where both particle and gas/vapour hazards exist.')}},
  'EN 14387':{labelWhere:[T('Filtre gövdesindeki EN 14387, tip/sınıf ve renk kodu','EN 14387, type/class and colour coding on filter body'),T('Ambalajdaki son kullanım ve saklama bilgisi','Expiry and storage information on packaging')],family:[F('EN 14387:2021','Gaz ve kombine filtreler','Gas and combined filters'),F('EN 143:2021','Yalnız partikül filtreleri','Particle-only filters'),F('EN 136 / EN 140','Uyumlu tam/yüz yarım maske ürün aileleri','Compatible full/half facepiece product families')],confused:[C('A/B/E/K harfi ≠ her kimyasala koruma','A/B/E/K letter ≠ protection against every chemical','Filtre tipi yalnız belirli kirletici grubunu gösterir; SDS ve üretici verisi gerekir.','Filter type identifies a contaminant group; SDS and manufacturer data are required.')],wrongChoice:{scenario:T('Koku geldiğinde filtreyi değiştirmek üzere plansız kullanmak.','Using filters without a change schedule and relying only on smell.'),why:T('Koku eşiği güvenilir bir servis ömrü göstergesi değildir ve kirleticiye göre değişir.','Odour threshold is not a reliable service-life indicator and varies by contaminant.'),better:T('Risk değerlendirmesi, üretici servis ömrü verisi ve planlı change-out yaklaşımı kullan.','Use risk assessment, manufacturer service-life data and a planned change-out approach.')}},
"""
              exp=exp.replace("};\n\nexport const getPPEExperience",block+"};\n\nexport const getPPEExperience")
