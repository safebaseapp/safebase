'EN 143':{product:T('Değiştirilebilir partikül filtresi','Replaceable particle filter'),classes:[I('P1','P1','P1','Partikül filtresi performans sınıfı; gerçek seçim maruziyet değerlendirmesine bağlıdır.','Particle-filter performance class; actual selection depends on exposure assessment.'),I('P2','P2','P2','Daha yüksek partikül filtre performans sınıfı.','Higher particle-filter performance class.'),I('P3','P3','P3','Yüksek partikül filtre performans sınıfı; sistem toplam koruması maskeye ve uyuma da bağlıdır.','High particle-filter performance class; total system protection also depends on facepiece and fit.')],marks:[I('EN 143:2021','Standart ve sürüm','Standard & edition','Güncel Avrupa partikül filtresi referansı.','Current European particle-filter reference.'),I('P1/P2/P3','Sınıf','Class','Filtre performans sınıfı.','Filter performance class.')],uses:[T('Toz','Dust'),T('Duman/partikül','Fume/particles'),T('Değiştirilebilir filtreli RPD','Replaceable-filter RPD')],checks:[T('Filtre sınıfı maruziyete uygun mu?','Is filter class suitable for exposure?'),T('Filtre hasarlı/ıslak/kirli mi?','Is filter damaged, wet or contaminated?'),T('Maske bağlantısı uyumlu mu?','Is facepiece connection compatible?'),T('Gaz/buhar riski ayrıca var mı?','Is there also a gas/vapour hazard?')],note:T('EN 143:2021 güncel yayımlanmış referanstır; yalnız partiküller içindir, gaz veya buhar koruması sağlamaz.','EN 143:2021 is the current published reference; it is for particles only and does not provide gas or vapour protection.')},
