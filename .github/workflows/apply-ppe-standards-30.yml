name: Apply PPE standards 30 expansion

on:
  push:
    branches: [feat/ppe-standards-30]
    paths:
      - '.github/workflows/apply-ppe-standards-30.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[ppe30-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ppe-standards-30
          fetch-depth: 0

      - name: Expand PPE standards library to 30
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root=Path('app/app/[locale]/ppe-standards')

          data_path=root/'data.ts'
          data=data_path.read_text()
          if "code:'EN 175'" not in data:
              block=r"""
{slug:'en-175-welding-eye-face-protection',code:'EN 175',category:'Eye protection',title:{tr:'Kaynak Göz ve Yüz Koruma Ekipmanı Standardı',en:'Welding Eye and Face Protection Equipment Standard'},purpose:{tr:'EN 175:1997, kaynak, kesme ve benzeri proseslerde kullanılan göz ve yüz koruyucu ekipmanın malzeme, tasarım ve performans gereklerini kapsar. BSI standardı halen current/under review olarak listeler; filtre seçimi için güncel kaynak koruma serileri ve üretici uygunluğu ayrıca doğrulanmalıdır.',en:'EN 175:1997 covers material, design and performance requirements for eye and face protective equipment used during welding, cutting and related processes. BSI still lists it as current/under review; filter selection and current welding-protector requirements must also be verified.'},use:{tr:'Kaynak, kesme ve sıcak metal işlerinde kaynak siperi, el siperi veya benzeri göz-yüz koruyucuların seçimi ve saha kontrolü.',en:'Selection and field checking of welding helmets, hand shields and related eye/face protectors for welding, cutting and hot-metal work.'},markings:{tr:'EN 175 işaretini, üretici/model bilgisini ve kullanılan filtrenin kaynak prosesine uygunluğunu kontrol edin; yalnız siper gövdesi işareti doğru filtre seçimi anlamına gelmez.',en:'Check EN 175 marking, manufacturer/model information and suitability of the installed filter for the welding process; protector-body marking alone does not prove correct filter selection.'}},
{slug:'en-169-welding-filters-legacy',code:'EN 169',category:'Eye protection',title:{tr:'EN 169 Eski Kaynak Filtresi Referansı',en:'EN 169 Legacy Welding Filter Reference'},purpose:{tr:'EN 169:2002 kaynak ve ilgili tekniklerde kullanılan filtrelerin eski performans/transmisyon referansıdır. BSI, EN 169:2002 standardını geri çekilmiş ve EN ISO 16321 serisi tarafından değiştirilmiş referanslar arasında listeler; yeni ürünlerde EN ISO 16321-2 kaynak koruyucuları için güncel ana referanstır.',en:'EN 169:2002 is a legacy performance/transmittance reference for welding filters. BSI lists EN 169:2002 among withdrawn standards replaced by the EN ISO 16321 suite; EN ISO 16321-2 is the current main reference for new welding protectors.'},use:{tr:'Mevcut EN 169 işaretli kaynak filtrelerini sahada tanımlama ve yeni ürün seçerken güncel EN ISO 16321-2 ile karşılaştırma.',en:'Field identification of existing EN 169-marked welding filters and comparison with current EN ISO 16321-2 when selecting new products.'},markings:{tr:'Eski ürünlerde filtre ölçek/gölge numarasını ve üretici işaretini okuyun; yeni ürün/sertifikasyonda EN ISO 16321-2 ve üretici filtre tablosunu doğrulayın.',en:'On legacy products read the filter scale/shade number and manufacturer marking; for new products/certification verify EN ISO 16321-2 and the manufacturer filter-selection table.'}},
{slug:'en-170-ultraviolet-filters-legacy',code:'EN 170',category:'Eye protection',title:{tr:'EN 170 Eski Ultraviyole Filtre Referansı',en:'EN 170 Legacy Ultraviolet Filter Reference'},purpose:{tr:'EN 170:2002, iş amaçlı göz koruyucularda ultraviyole filtrelerin eski transmisyon ve işaretleme referansıdır. Standart geri çekilmiştir; yeni mesleki göz/yüz korumasında EN ISO 16321-1:2022+A1:2025 güncel genel referanstır.',en:'EN 170:2002 is the legacy transmittance and marking reference for ultraviolet filters in occupational eye protection. It has been withdrawn; EN ISO 16321-1:2022+A1:2025 is the current general reference for new occupational eye/face protection.'},use:{tr:'Mevcut EN 170 işaretli UV filtreli koruyucuların tanımlanması ve yeni ürün seçiminde güncel seriyle karşılaştırılması.',en:'Identification of existing EN 170-marked UV-filter protectors and comparison with the current series when selecting new products.'},markings:{tr:'Eski filtre kodunu tek başına yeterli kabul etmeyin; gerçek UV kaynağını, filtre performansını, gözlük tipini ve güncel uygunluk belgesini birlikte doğrulayın.',en:'Do not rely on a legacy filter code alone; verify the actual UV source, filter performance, protector type and current conformity documentation together.'}},
{slug:'en-172-sun-glare-filters-legacy',code:'EN 172',category:'Eye protection',title:{tr:'EN 172 Eski Endüstriyel Güneş Parlaması Filtresi Referansı',en:'EN 172 Legacy Industrial Sun-Glare Filter Reference'},purpose:{tr:'EN 172, endüstriyel kullanımda güneş parlamasına karşı filtreler için eski Avrupa referansıdır ve geri çekilmiştir. Yeni mesleki göz/yüz koruyucularında EN ISO 16321-1 güncel genel referanstır; yalnız genel amaçlı güneş gözlüğü ile iş güvenliği gözlüğü birbirine karıştırılmamalıdır.',en:'EN 172 is the withdrawn legacy European reference for sun-glare filters used occupationally. EN ISO 16321-1 is the current general reference for new occupational eye/face protectors; ordinary sunglasses must not be confused with occupational safety eyewear.'},use:{tr:'Açık saha, parlama ve güneş ışığı bulunan işlerde mevcut EN 172 ürünlerinin tanımlanması ve yeni koruyucu seçiminde güncel mesleki standardın doğrulanması.',en:'Identification of existing EN 172 products in outdoor/glare work and verification of the current occupational standard when selecting new protection.'},markings:{tr:'Filtre koyuluğu, renk tanıma ihtiyacı, mekanik koruma ve güncel ürün standardını birlikte kontrol edin; koyu lens tek başına güvenlik performansı değildir.',en:'Check filter darkness, colour-recognition needs, mechanical protection and the current product standard together; a dark lens alone is not evidence of safety performance.'}},
{slug:'en-1731-mesh-eye-face-protectors-legacy',code:'EN 1731',category:'Eye protection',title:{tr:'EN 1731 Eski Mesh Göz ve Yüz Koruyucu Referansı',en:'EN 1731 Legacy Mesh Eye and Face Protector Reference'},purpose:{tr:'EN 1731:2006, mesh göz ve yüz koruyucular için eski ürün standardıdır ve geri çekilmiştir. Güncel referans EN ISO 16321-3:2022+A1:2026 olup mesh koruyucularda mekanik parçacık risklerine yönelik ek gereklilikleri EN ISO 16321-1 ile birlikte ele alır.',en:'EN 1731:2006 is the withdrawn legacy product standard for mesh eye and face protectors. The current reference is EN ISO 16321-3:2022+A1:2026, used with EN ISO 16321-1 for mesh protectors against mechanical particle hazards.'},use:{tr:'Ormancılık, çalı temizleme ve uçan parçacık riskinde mesh siperlerin tanımlanması; sıvı sıçraması, UV/IR veya erimiş metal için mesh tek başına uygun değildir.',en:'Identification of mesh visors for forestry, brush cutting and flying-particle hazards; mesh alone is not suitable for liquid splash, UV/IR or molten-metal hazards.'},markings:{tr:'Mevcut EN 1731 işaretli ürünlerde ürün/üretici bilgisini kontrol edin; yeni seçimde EN ISO 16321-3 güncel işaretini ve mekanik tehlike uygunluğunu doğrulayın.',en:'Check product/manufacturer information on existing EN 1731-marked products; for new selection verify current EN ISO 16321-3 marking and suitability for the mechanical hazard.'}},
{slug:'en-812-industrial-bump-caps',code:'EN 812',category:'Head protection',title:{tr:'Endüstriyel Darbe Başlığı Standardı',en:'Industrial Bump Cap Standard'},purpose:{tr:'EN 812:2012, kullanıcının başını sert ve sabit cisimlere çarpmasına bağlı yüzeysel yaralanmalara karşı endüstriyel darbe başlıklarını kapsar. Düşen veya fırlayan cisimlere karşı EN 397 baretinin yerine geçmez.',en:'EN 812:2012 covers industrial bump caps intended to protect against striking the head on hard stationary objects and resulting superficial injuries. It is not a substitute for an EN 397 helmet against falling or thrown objects.'},use:{tr:'Depo, bakım, tesis içi düşük tavanlı alanlar ve düşen cisim riskinin bulunmadığı çarpma riskli işler.',en:'Warehouses, maintenance, low-clearance indoor areas and tasks with bump hazards but no falling-object hazard.'},markings:{tr:'EN 812 işaretini, beden aralığını ve üretici bilgisini kontrol edin; saha riskinde düşen cisim varsa bump cap yerine uygun endüstriyel baret seçin.',en:'Check EN 812 marking, size range and manufacturer information; where falling-object risk exists select an appropriate industrial helmet instead of a bump cap.'}},
{slug:'en-12492-mountaineering-helmets',code:'EN 12492',category:'Head protection',title:{tr:'Dağcılık Tipi Koruyucu Baret Standardı',en:'Mountaineering Helmet Standard'},purpose:{tr:'EN 12492:2025, dağcılık ve benzer tehlikelere sahip tırmanış, mağaracılık, via ferrata ve rope-course faaliyetlerinde kullanılan koruyucu baretlerin güvenlik ve test gereklerini kapsar. İşyerinde kullanım için EN 397 ile otomatik olarak eşdeğer kabul edilmemelidir.',en:'EN 12492:2025 specifies safety requirements and test methods for helmets used in mountaineering and activities with similar hazards such as climbing, caving, via ferrata and rope courses. It must not automatically be treated as equivalent to EN 397 for workplace use.'},use:{tr:'İple erişim veya yüksekte çalışma ekipmanı seçimi değerlendirilirken ürünün gerçek sertifikasyon kombinasyonu ve saha riskiyle birlikte incelenir.',en:'When considered for rope access or work-at-height use, the actual product certification combination and site risk assessment must be checked together.'},markings:{tr:'EN 12492:2025 işaretini, üretici/modeli, beden aralığını ve retention/chinstrap sistemini kontrol edin; işyeri gereksinimi EN 397 veya başka standardı ayrıca gerektiriyorsa bunu doğrulayın.',en:'Check EN 12492:2025 marking, manufacturer/model, size range and retention/chinstrap system; separately verify any workplace requirement for EN 397 or another standard.'}},
{slug:'en-405-valved-filtering-half-masks',code:'EN 405',category:'Respiratory protection',title:{tr:'Gaz veya Gaz+Partikül İçin Valfli Filtreli Yarım Maske Standardı',en:'Valved Filtering Half Mask Standard for Gases or Gases and Particles'},purpose:{tr:'EN 405:2001+A1:2009, gazlara veya gaz+partiküllere karşı entegre filtreli valfli yarım maskelerin performans, test ve işaretleme gereklerini kapsar. Oksijen yetersiz ortamlar ve kaçış cihazları için uygun değildir.',en:'EN 405:2001+A1:2009 specifies performance, testing and marking requirements for valved filtering half masks with integral gas or combined filters. It is not for oxygen-deficient atmospheres or escape devices.'},use:{tr:'Risk değerlendirmesinin belirli gaz/buhar veya gaz+partikül kombinasyonu için uygun entegre filtreli yarım maske gerektirdiği işler.',en:'Tasks where risk assessment requires an appropriate integral-filter half mask for specified gases/vapours or gas-plus-particle combinations.'},markings:{tr:'EN 405 işaretini, filtre tip/sınıfını, kullanım sınırlarını ve üretici talimatını kontrol edin; kirleticiyi tanımlamadan filtre seçmeyin.',en:'Check EN 405 marking, filter type/class, use limits and manufacturer instructions; never select a filter before identifying the contaminant.'}},
{slug:'en-143-particle-filters',code:'EN 143',category:'Respiratory protection',title:{tr:'Solunum Koruyucu Partikül Filtresi Standardı',en:'Respiratory Particle Filter Standard'},purpose:{tr:'EN 143:2021, solunum koruyucu cihazlarda değiştirilebilir partikül filtrelerinin gereklilik, test, sınıflandırma ve işaretlemelerini kapsar. Partikül filtreleri gaz ve buharlara karşı koruma sağlamaz.',en:'EN 143:2021 specifies requirements, testing, classification and marking for replaceable particle filters used in respiratory protective devices. Particle filters do not protect against gases or vapours.'},use:{tr:'Uyumlu yarım/tam yüz maskesi veya diğer uygun RPD üzerinde partikül maruziyetine karşı değiştirilebilir filtre kullanılan işler.',en:'Tasks using replaceable particle filters on compatible half/full facepieces or other suitable RPDs for particle exposure.'},markings:{tr:'EN 143:2021 işaretini, P1/P2/P3 sınıfını, bağlantı uyumluluğunu ve üretici kullanım/servis sınırlarını kontrol edin.',en:'Check EN 143:2021 marking, P1/P2/P3 class, connection compatibility and manufacturer use/service limits.'}},
{slug:'en-14387-gas-combined-filters',code:'EN 14387',category:'Respiratory protection',title:{tr:'Gaz ve Kombine Solunum Filtresi Standardı',en:'Gas and Combined Respiratory Filter Standard'},purpose:{tr:'EN 14387:2021, yardımsız solunum koruyucu cihazlarda kullanılan değiştirilebilir gaz filtreleri ve kombine filtrelerin gereklilik, sınıflandırma, test ve işaretlemelerini kapsar. Filtre seçimi kirletici türü ve konsantrasyonuna bağlıdır.',en:'EN 14387:2021 specifies requirements, classification, testing and marking for replaceable gas filters and combined filters used in unassisted respiratory protective devices. Filter selection depends on contaminant type and concentration.'},use:{tr:'Uygun maske bağlantısıyla organik/inorganik gaz, asit gazı, amonyak ve ilgili kombine maruziyetlerde risk değerlendirmesine göre filtre seçimi.',en:'Risk-based filter selection for organic/inorganic gases, acid gases, ammonia and relevant combined exposures using a compatible facepiece connection.'},markings:{tr:'EN 14387:2021 işaretini, A/B/E/K ve varsa AX/SX gibi filtre tipini, sınıfını, renk kodunu, partikül kombinasyonunu ve son kullanım tarihini kontrol edin.',en:'Check EN 14387:2021 marking, filter type such as A/B/E/K and where applicable AX/SX, class, colour code, particle combination and expiry date.'}},
"""
              data=data.replace("];\nexport const getPPEStandard",block+"];\nexport const getPPEStandard")
              data_path.write_text(data)

          tech_path=root/'tech-data.ts'
          tech=tech_path.read_text()
          if "'EN 175':" not in tech:
              block=r"""
'EN 175':{product:T('Kaynak göz/yüz koruyucu ekipmanı','Welding eye/face protective equipment'),classes:[I('PROTECTOR','Siper/gövde','Protector body','Kaynak siperi veya el siperi, uygun kaynak filtresini taşıyan koruyucu ekipmandır.','Welding helmet or hand shield is protective equipment carrying a suitable welding filter.'),I('FILTER','Filtre ayrı seçimdir','Filter is a separate selection','Gövde standardı doğru filtre gölge seviyesini tek başına belirlemez.','Protector-body compliance alone does not determine the correct filter shade.')],marks:[I('EN 175','Standart','Standard','Kaynak göz/yüz koruyucu ekipman referansı.','Welding eye/face protective-equipment reference.'),I('ID','Kimlik','Identity','Üretici/model ve izlenebilirlik.','Manufacturer/model and traceability.')],uses:[T('Ark kaynağı','Arc welding'),T('Kesme','Cutting'),T('Sıcak metal işleri','Hot-metal work')],checks:[T('Siper gövdesi çatlak veya ısıdan deforme mi?','Any crack or heat deformation in protector body?'),T('Filtre ve kapak lensi sağlam ve doğru oturmuş mu?','Are filter and cover lens intact and correctly fitted?'),T('Filtre seviyesi gerçek prosese uygun mu?','Is filter level suitable for the actual process?')],note:T('BSI, EN 175:1997 standardını current/under review olarak listeler. Filtre ve güncel kaynak koruyucu gereklilikleri üretici dokümanı ve ilgili EN ISO 16321 bölümleriyle birlikte doğrulanmalıdır.','BSI lists EN 175:1997 as current/under review. Filter and current welding-protector requirements should be verified with manufacturer documentation and relevant EN ISO 16321 parts.')},
'EN 169':{product:T('Legacy kaynak filtresi','Legacy welding filter'),classes:[I('LEGACY','Eski referans','Legacy reference','EN 169:2002 geri çekilmiştir; sahada eski ürün işaretleri görülebilir.','EN 169:2002 is withdrawn; legacy product markings may still be encountered.'),I('CURRENT','EN ISO 16321-2','EN ISO 16321-2','Yeni kaynak göz/yüz koruyucuları için güncel uzmanlık standardı.','Current specialist standard for new welding eye/face protectors.')],marks:[I('SHADE','Gölge/ölçek','Shade/scale','Kaynak prosesi ve parametrelerine uygun filtre seviyesi üretici tablosuyla seçilir.','Filter level is selected from manufacturer guidance for process parameters.'),I('EN ISO 16321-2','Güncel referans','Current reference','Yeni ürün ve sertifikasyonda güncel kaynak koruma standardı.','Current welding-protection standard for new products/certification.')],uses:[T('Legacy filtre tanımlama','Legacy filter identification'),T('Kaynak filtresi seçimi','Welding filter selection')],checks:[T('Filtre çizik, çatlak veya ısı hasarlı mı?','Any scratch, crack or heat damage?'),T('Gölge seviyesi prosese uygun mu?','Is shade suitable for the process?'),T('Yeni üründe güncel standart doğrulandı mı?','Has the current standard been verified for a new product?')],note:T('EN 169:2002 geri çekilmiş bir legacy referanstır; EN ISO 16321-2 güncel kaynak koruyucu referansıdır.','EN 169:2002 is a withdrawn legacy reference; EN ISO 16321-2 is the current welding-protector reference.')},
'EN 170':{product:T('Legacy UV filtreli göz koruyucu','Legacy UV-filter eye protector'),classes:[I('LEGACY','Eski UV filtresi','Legacy UV filter','EN 170:2002 geri çekilmiş eski filtredir.','EN 170:2002 is a withdrawn legacy filter reference.'),I('CURRENT','EN ISO 16321-1','EN ISO 16321-1','Yeni mesleki göz/yüz korumasında güncel genel referans.','Current general reference for new occupational eye/face protection.')],marks:[I('UV','UV filtre performansı','UV filter performance','Gerçek UV kaynağı ve ürün beyanıyla eşleştirilir.','Matched to the actual UV source and product declaration.')],uses:[T('UV kaynaklı prosesler','UV-emitting processes'),T('Legacy ürün kontrolü','Legacy product checks')],checks:[T('Lens temiz ve optik olarak kullanılabilir mi?','Is lens clean and optically serviceable?'),T('Gerçek UV kaynağı için üretici performansı yeterli mi?','Is manufacturer performance adequate for the actual UV source?')],note:T('EN 170:2002 geri çekilmiştir; yeni ürünlerde EN ISO 16321-1:2022+A1:2025 güncel genel referanstır.','EN 170:2002 is withdrawn; EN ISO 16321-1:2022+A1:2025 is the current general reference for new products.')},
'EN 172':{product:T('Legacy endüstriyel güneş parlaması filtresi','Legacy industrial sun-glare filter'),classes:[I('LEGACY','Eski referans','Legacy reference','EN 172 geri çekilmiştir.','EN 172 is withdrawn.'),I('OCCUPATIONAL','Mesleki koruma','Occupational protection','İş güvenliği gözlüğü yalnız lens koyuluğuyla tanımlanmaz; mekanik/optik performans da gerekir.','Occupational safety eyewear is not defined by lens darkness alone; mechanical and optical performance also matter.')],marks:[I('FILTER','Filtre','Filter','Parlama azaltımı ve renk algısı iş gereksinimleriyle eşleştirilir.','Glare reduction and colour recognition are matched to task needs.')],uses:[T('Açık saha','Outdoor work'),T('Parlama riski','Glare exposure')],checks:[T('Lens koyuluğu görüş görevine uygun mu?','Is lens darkness suitable for the visual task?'),T('Ürün mesleki göz koruyucu olarak sertifikalı mı?','Is the product certified as occupational eye protection?')],note:T('EN 172 geri çekilmiştir; yeni mesleki ürünlerde EN ISO 16321-1 güncel genel referanstır.','EN 172 is withdrawn; EN ISO 16321-1 is the current general reference for new occupational products.')},
'EN 1731':{product:T('Legacy mesh göz/yüz koruyucu','Legacy mesh eye/face protector'),classes:[I('MESH','Mesh siper','Mesh protector','Uçan parçacık ve fragment gibi mekanik tehlikeler için mesh yapı.','Mesh construction for mechanical hazards such as flying particles and fragments.'),I('LIMIT','Kapsam sınırı','Scope limit','Sıvı sıçraması, UV/IR veya erimiş metal için tek başına uygun değildir.','Not suitable alone for liquid splash, UV/IR or molten metal.')],marks:[I('EN 1731','Legacy standart','Legacy standard','Eski ürünlerde görülebilir.','May appear on legacy products.'),I('EN ISO 16321-3','Güncel referans','Current reference','Yeni mesh koruyucular için güncel standart.','Current standard for new mesh protectors.')],uses:[T('Ormancılık','Forestry'),T('Çalı temizleme','Brush cutting'),T('Uçan parçacık','Flying particles')],checks:[T('Mesh ezilmiş, yırtılmış veya delikleri bozulmuş mu?','Is mesh crushed, torn or distorted?'),T('Siper bağlantısı güvenli mi?','Is visor mounting secure?'),T('Tehlike mesh kapsamına uygun mu?','Is the hazard within mesh-protector scope?')],note:T('EN 1731:2006 geri çekilmiştir; güncel referans EN ISO 16321-3:2022+A1:2026 ve EN ISO 16321-1 ile birlikte kullanılır.','EN 1731:2006 is withdrawn; the current reference is EN ISO 16321-3:2022+A1:2026 used with EN ISO 16321-1.')},
'EN 812':{product:T('Endüstriyel darbe başlığı','Industrial bump cap'),classes:[I('BUMP','Çarpma koruması','Bump protection','Sabit sert cisimlere baş çarpmasına bağlı yüzeysel yaralanmaları azaltmak için tasarlanır.','Designed to reduce superficial injury from striking the head on hard stationary objects.'),I('NOT HELMET','Baret değildir','Not a safety helmet','Düşen/fırlayan cisimlere karşı EN 397 yerine geçmez.','Does not replace EN 397 protection against falling/thrown objects.')],marks:[I('EN 812','Standart','Standard','Endüstriyel bump cap standardı.','Industrial bump-cap standard.'),I('SIZE','Beden','Size','Kullanıcı beden aralığı.','Wearer size range.')],uses:[T('Depo','Warehousing'),T('Bakım','Maintenance'),T('Düşük tavan','Low-clearance areas')],checks:[T('Kabuk/insert çatlak veya deforme mi?','Is shell/insert cracked or deformed?'),T('Başlık doğru oturuyor mu?','Does cap fit correctly?'),T('Sahada düşen cisim riski var mı?','Is there a falling-object hazard on the task?')],note:T('EN 812:2012 BSI tarafından current/under review listelenmektedir; bump cap endüstriyel güvenlik bareti değildir.','EN 812:2012 is listed by BSI as current/under review; a bump cap is not an industrial safety helmet.')},
'EN 12492':{product:T('Dağcılık tipi koruyucu baret','Mountaineering helmet'),classes:[I('MOUNTAINEERING','Dağcılık tipi','Mountaineering type','Darbe riskini azaltmak için dağcılık ve benzer faaliyetlere yönelik baret.','Helmet for mountaineering and similar activities to reduce impact injury risk.'),I('WORKPLACE','İşyeri seçimi','Workplace selection','EN 397 ile otomatik olarak eşdeğer değildir; ürünün çift/çoklu sertifikasyonu ayrıca doğrulanır.','Not automatically equivalent to EN 397; dual/multiple certification must be verified on the actual product.')],marks:[I('EN 12492:2025','Standart ve sürüm','Standard & edition','Güncel Avrupa referansı.','Current European reference.'),I('SIZE','Beden','Size','Baş çevresi aralığı.','Head circumference range.')],uses:[T('Tırmanış','Climbing'),T('Rope course','Rope course'),T('Benzer yükseklik faaliyetleri','Similar height activities')],checks:[T('Kabuk ve enerji emici yapı hasarsız mı?','Are shell and energy-absorbing structure undamaged?'),T('Çene bağı/retention sistemi çalışıyor mu?','Does chinstrap/retention system function correctly?'),T('İşyeri risk değerlendirmesinin istediği standart ürün üzerinde gerçekten var mı?','Is the workplace-required standard actually marked on the product?')],note:T('EN 12492:2025 güncel sürümdür ve EN 12492:2012 sürümünün yerini almıştır. İşyerinde yalnız görünüşe dayanarak EN 397 eşdeğeri kabul edilmez.','EN 12492:2025 is current and replaces EN 12492:2012. In workplaces it must not be assumed equivalent to EN 397 based on appearance alone.')},
