      - name: Remove temporary workflow and commit package
        shell: bash
        run: |
          rm -f .github/workflows/apply-ppe-standards-30.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'expand PPE standards library to 30 [ppe30-applied]'
          git push origin HEAD:feat/ppe-standards-30
