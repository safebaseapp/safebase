name: Install approved four eye filter PPE visuals
on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-sernem-eye-filter-pack.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply approved image files
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 120 'https://at.adobe.com/PRDDkv0nEYq2JbSF' -o /tmp/en-169.png
          curl -fL --retry 3 --max-time 120 'https://at.adobe.com/ZGOX4FoTdFQQGGpr' -o /tmp/en-170.png
          curl -fL --retry 3 --max-time 120 'https://at.adobe.com/mAl5ao1gtcNzLKHB' -o /tmp/en-172.png
          curl -fL --retry 3 --max-time 120 'https://at.adobe.com/4slkDfBnwloEGryi' -o /tmp/en-1731.png
          python3 -m pip install --quiet --user Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import re
          codes=['EN 169','EN 170','EN 172','EN 1731']
          base=Path('app/public/ppe-standards/approved');base.mkdir(parents=True,exist_ok=True)
          p=Path('app/app/[locale]/ppe-standards/visual-data.ts')
          lines=p.read_text().splitlines(keepends=True)
          for code in codes:
              slug=code.lower().replace(' ','-')
              im=Image.open('/tmp/'+slug+'.png').convert('RGB')
              assert im.width>=1000 and im.height>=700,(code,im.size)
              dest=base/(slug+'.webp')
              im.save(dest,'WEBP',quality=87,method=6)
              assert dest.stat().st_size>20000
              hits=[i for i,x in enumerate(lines) if x.lstrip().startswith("'"+code+"':")]
              assert len(hits)==1,code
              i=hits[0]; ref="'/ppe-standards/approved/"+slug+".webp'"
              row,n=re.subn(r"photo:(?:'[^']+'|[0-9]+)",'photo:'+ref,lines[i],count=1)
              assert n==1,code
              row,n=re.subn(r"scenes:\[[^\]]*\]",'scenes:['+ref+']',row,count=1)
              assert n==1,code
              lines[i]=row
          p.write_text(''.join(lines))
          PY
      - name: Commit approved images
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/public/ppe-standards/approved 'app/app/[locale]/ppe-standards/visual-data.ts'
          git diff --cached --quiet && exit 0
          git commit -m 'feat(ppe): four approved welding UV sunglare and mesh visuals'
          git push
