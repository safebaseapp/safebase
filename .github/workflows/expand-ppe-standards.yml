          exp_block=r'''
  'EN ISO 21420':{labelWhere:[T('Eldiven/ambalaj üzerindeki standart ve ürün etiketi','Standard and product label on glove/packaging'),T('Üretici teknik föyü','Manufacturer technical datasheet')],family:[F('EN ISO 21420','Koruyucu eldivenler için genel gereklilikler','General requirements for protective gloves'),F('EN 388 / EN ISO 374 / EN 407','Tehlikeye özgü performans standartları ayrıca gerekir','Hazard-specific performance standards are additionally required')],confused:[C('EN ISO 21420 ≠ belirli risk performansı','EN ISO 21420 ≠ specific hazard performance','Genel ürün standardıdır; mekanik/kimyasal/termal koruma seviyesini tek başına göstermez.','It is a general product standard and does not by itself state mechanical/chemical/thermal protection.')],wrongChoice:{scenario:T('Yalnız EN ISO 21420 işaretini görüp eldiveni kimyasal veya kesilme riskine uygun kabul etmek.','Accepting a glove for chemical or cut risk only because EN ISO 21420 is marked.'),why:T('İşe özgü risk standardı ayrıca doğrulanmalıdır.','The task-specific hazard standard must also be verified.'),better:T('EN ISO 21420 + gerçek tehlikeye uygun EN 388/EN ISO 374/EN 407 vb. performansını birlikte kontrol et.','Check EN ISO 21420 together with EN 388/EN ISO 374/EN 407 etc. as appropriate to the real hazard.')}},
  'EN 407':{labelWhere:[T('Eldiven sırtındaki termal risk piktogramı ve performans kodu','Thermal-risk pictogram and performance code on glove back'),T('Manşet/ambalaj etiketi','Cuff/packaging label')],family:[F('EN 407:2020','Termal risklere karşı el koruma','Hand protection against thermal risks'),F('EN ISO 21420','Genel eldiven gerekleri','General glove requirements'),F('EN 12477','Kaynakçı eldivenleri ayrı ürün standardıdır','Welder gloves are a separate product standard')],confused:[C('Yüksek temas ısısı ≠ tüm termal risklerde yüksek koruma','High contact-heat level ≠ high protection against every thermal hazard','Altı performans konumu farklı termal tehlikeleri temsil eder.','The six performance positions represent different thermal hazards.')],wrongChoice:{scenario:T('Yalnız temas ısısı seviyesi yüksek diye eldiveni alev veya erimiş metal işi için seçmek.','Selecting a glove for flame or molten metal only because contact-heat level is high.'),why:T('İlgili performans konumları ayrı test edilir.','Relevant performance positions are tested separately.'),better:T('Gerçek tehlikeyi belirle ve karşılık gelen EN 407 performans konumunu üretici verisiyle doğrula.','Identify the real hazard and verify the corresponding EN 407 performance position with manufacturer data.')}},
  'EN ISO 11611':{labelWhere:[T('Giysi iç etiketi / bakım etiketi','Garment inner/care label'),T('Üretici teknik föyü ve uygunluk beyanı','Manufacturer datasheet and declaration of conformity')],family:[F('EN ISO 11611','Kaynak ve benzeri proses koruyucu giysi','Welding/allied-process protective clothing'),F('EN ISO 11612','Genel ısı/alev koruyucu giysi; kapsam farklıdır','Heat/flame protective clothing with a different scope')],confused:[C('Kaynak giysisi ≠ kaynak eldiveni/yüz siperi','Welding clothing ≠ welding gloves/face shield','Giysi standardı el, göz/yüz ve ayak korumasını tek başına tamamlamaz.','The clothing standard does not by itself complete hand, eye/face and foot protection.')],wrongChoice:{scenario:T('EN ISO 11611 giysi giyildiği için kaynak başlığı ve eldiveni gereksiz saymak.','Treating welding helmet and gloves as unnecessary because EN ISO 11611 clothing is worn.'),why:T('Farklı vücut bölgeleri için ayrı PPE gerekir.','Separate PPE is required for different body areas.'),better:T('Kaynak risk değerlendirmesine göre giysi + yüz/göz + el + ayak korumasını sistem olarak seç.','Select clothing + face/eye + hand + foot protection as a system from the welding risk assessment.')}},
  'EN ISO 11612':{labelWhere:[T('Giysi iç etiketi ve performans kodları','Garment inner label and performance codes'),T('Üretici teknik föyü','Manufacturer technical datasheet')],family:[F('EN ISO 11612','Isı ve aleve karşı koruyucu giysi','Protective clothing against heat/flame'),F('EN ISO 11611','Kaynak proseslerine özel giysi standardı','Welding-process-specific clothing standard')],confused:[C('EN ISO 11612 ≠ her yüksek sıcaklık senaryosuna otomatik uygunluk','EN ISO 11612 ≠ automatic suitability for every high-temperature scenario','İşaretlenen A-F performansları hangi ısı tehlikelerine karşı test edildiğini gösterir.','Marked A-F performances indicate which thermal hazards were tested.')],wrongChoice:{scenario:T('Üründe yalnız temel alev performansı varken erimiş metal sıçramasına karşı da koruduğunu varsaymak.','Assuming molten-metal splash protection when only basic flame performance is marked.'),why:T('Erimiş metal performansı ayrı test ve işaret gerektirir.','Molten-metal performance requires separate testing and marking.'),better:T('İşin ısı tehlikesiyle ürün üzerindeki performans kodlarını birebir eşleştir.','Match task heat hazards directly to the marked product performance codes.')}},
  'EN ISO 20471':{labelWhere:[T('Giysi iç etiketi üzerindeki standart ve sınıf işareti','Standard and class marking on garment inner label'),T('Üretici bakım/yıkama talimatı','Manufacturer care/wash instructions')],family:[F('EN ISO 20471:2013+A1:2016','Yüksek görünürlüklü uyarı giysisi','High-visibility warning clothing'),F('EN 17353','Orta risk görünürlük ekipmanları farklı standarda tabidir','Enhanced visibility equipment for medium-risk situations is a different standard')],confused:[C('Reflektif şerit ≠ otomatik EN ISO 20471 uygunluğu','Reflective strip ≠ automatic EN ISO 20471 compliance','Giysi sınıfı minimum floresan ve retroreflektif malzeme alanlarına bağlıdır.','Garment class depends on minimum fluorescent and retroreflective material areas.')],wrongChoice:{scenario:T('Her reflektif yeleği yüksek risk trafik sahasında EN ISO 20471 Class 3 kabul etmek.','Treating every reflective vest as EN ISO 20471 Class 3 for high-risk traffic areas.'),why:T('Sınıf ürün etiketi ve tasarım alanlarıyla doğrulanır.','Class must be verified from product marking and garment design areas.'),better:T('Risk seviyesini belirle ve ürün etiketindeki EN ISO 20471 sınıfını doğrula.','Determine risk level and verify the EN ISO 20471 class on the product label.')}},
  'EN IEC 61482-2':{labelWhere:[T('Giysi iç etiketi / ark işareti','Garment inner label / arc marking'),T('Üretici ark performans teknik föyü','Manufacturer arc-performance datasheet')],family:[F('EN IEC 61482-2','Elektrik arkı termal tehlikelerine karşı giysi','Clothing against electric-arc thermal hazards'),F('EN 60903','Elektrik çarpması için yalıtkan eldiven ayrı standarda tabidir','Insulating gloves for electric shock are a separate standard')],confused:[C('Ark koruması ≠ elektriksel yalıtım','Arc protection ≠ electrical insulation','Giysi arkın termal etkisini azaltır; elektrik çarpmasını kapsamaz.','Clothing addresses arc thermal effects, not electric shock.')],wrongChoice:{scenario:T('Ark dereceli giysiyi gerilim temasına karşı yalıtım olarak görmek.','Treating arc-rated clothing as electrical insulation against voltage contact.'),why:T('Elektrik çarpması için ayrı yalıtkan PPE ve çalışma yöntemi gerekir.','Electric-shock risk requires separate insulating PPE and work methods.'),better:T('Ark termal riski + elektrik çarpması riskini ayrı değerlendir ve her biri için uygun PPE seç.','Assess arc thermal risk and electric-shock risk separately and select PPE for each.')}},
  'EN 1149-5':{labelWhere:[T('Giysi iç etiketi ve elektrostatik işaret','Garment inner label and electrostatic marking'),T('Üretici topraklama/kullanım talimatı','Manufacturer earthing/use instructions')],family:[F('EN 1149-5:2018','Elektrostatik koruyucu giysi gereklilikleri','Electrostatic protective clothing requirements'),F('EN 16350','Elektrostatik dağıtıcı koruyucu eldivenler ayrı standarda tabidir','Electrostatic dissipative protective gloves are a separate standard')],confused:[C('Antistatik ≠ elektrik çarpmasına karşı koruma','Antistatic ≠ electric-shock protection','EN 1149-5 şebeke gerilimine karşı koruma sağlamaz.','EN 1149-5 does not protect against mains voltage.')],wrongChoice:{scenario:T('EN 1149-5 giysiyi canlı elektrik işinde yalıtkan giysi gibi kullanmak.','Using EN 1149-5 clothing as insulating clothing for live electrical work.'),why:T('Standart elektrostatik kıvılcım riskine yöneliktir, elektrik şokuna değil.','The standard addresses electrostatic ignition risk, not electric shock.'),better:T('Elektrostatik ve elektrik çarpması risklerini ayrı değerlendir.','Assess electrostatic and electric-shock hazards separately.')}},
