name: Expand PPE standards library

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand PPE standards to 20
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root=Path('app/app/[locale]/ppe-standards')
          data=root/'data.ts'
          tech=root/'tech-data.ts'
          exp=root/'experience-data.ts'
          vis=root/'visual-data.ts'
          detail=root/'[slug]'/'page.tsx'

          def insert_before(path, marker, block, guard):
              s=path.read_text()
              if guard in s:
                  return False
              if marker not in s:
                  raise SystemExit(f'Marker not found in {path}: {marker!r}')
              s=s.replace(marker, block+'\n'+marker, 1)
              path.write_text(s)
              return True

          data_block=r'''
{slug:'en-iso-21420-protective-gloves-general-requirements',code:'EN ISO 21420',category:'Hand protection',title:{tr:'Koruyucu Eldivenler Genel Gereklilik Standardı',en:'Protective Gloves General Requirements Standard'},purpose:{tr:'EN ISO 21420, koruyucu eldivenler için tasarım, yapım, zararsızlık, konfor/verimlilik, işaretleme ve üretici bilgilerine ilişkin genel gereklilikleri kapsar. ISO 21420:2020 sürümü 2025 yılında tekrar teyit edilmiştir; 2022 değişikliği de yayımlanmıştır.',en:'EN ISO 21420 covers general requirements for protective glove design and construction, innocuousness, comfort/efficiency, marking and manufacturer information. ISO 21420:2020 was reconfirmed in 2025 and has a published 2022 amendment.'},use:{tr:'Mekanik, kimyasal, termal veya diğer özel risk standartlarıyla birlikte kullanılan koruyucu eldivenlerin genel ürün gereklilikleri.',en:'General product requirements for protective gloves used together with mechanical, chemical, thermal or other hazard-specific standards.'},markings:{tr:'EN ISO 21420 işaretini, üretici/ürün kimliğini, bedeni ve üretici talimatını kontrol edin; koruma seviyesi için ayrıca ilgili risk standardını doğrulayın.',en:'Check EN ISO 21420 marking, manufacturer/product identity, size and manufacturer instructions; verify the relevant hazard-specific standard separately for protection performance.'}},
{slug:'en-407-thermal-protective-gloves',code:'EN 407',category:'Hand protection',title:{tr:'Termal Risklere Karşı Koruyucu Eldiven Standardı',en:'Protective Gloves Against Thermal Risks Standard'},purpose:{tr:'EN 407:2020, profesyonel kullanımda ısı ve/veya ateşe karşı koruyucu eldivenler ve diğer el koruyucuları için gereklilik, test, işaretleme ve kullanıcı bilgisini kapsar. EN ISO 21420 ile birlikte kullanılır.',en:'EN 407:2020 specifies requirements, testing, marking and user information for protective gloves and other hand protection against heat and/or fire, and is used together with EN ISO 21420.'},use:{tr:'Sıcak yüzey, alev, konvektif/radyant ısı veya erimiş metal sıçraması riski bulunan işler.',en:'Tasks involving hot surfaces, flame, convective/radiant heat or molten-metal splash hazards.'},markings:{tr:'EN 407 piktogramını ve altı performans konumunu kontrol edin: alev yayılımı, temas ısısı, konvektif ısı, radyant ısı, küçük erimiş metal sıçramaları ve büyük miktarda erimiş metal; X test edilmedi/uygulanmadı anlamına gelebilir.',en:'Check the EN 407 pictogram and six performance positions: flame spread, contact heat, convective heat, radiant heat, small splashes of molten metal and large quantities of molten metal; X can indicate not tested/not applicable.'}},
{slug:'en-iso-11611-welding-protective-clothing',code:'EN ISO 11611',category:'Protective clothing',title:{tr:'Kaynak ve Benzeri Prosesler İçin Koruyucu Giysi Standardı',en:'Protective Clothing for Welding and Allied Processes'},purpose:{tr:'EN ISO 11611, kaynak ve benzeri proseslerde kullanılan koruyucu giysiler için minimum güvenlik gerekliliklerini ve test yöntemlerini kapsar. Güncel ISO sürümü ISO 11611:2024’tür; yeni bir sonraki sürüm halen geliştirme aşamasındadır.',en:'EN ISO 11611 specifies minimum safety requirements and test methods for protective clothing used during welding and allied processes. The current ISO edition is ISO 11611:2024; a subsequent revision is under development.'},use:{tr:'Kaynak, kesme ve benzer sıcak metal proseslerinde kıvılcım, küçük erimiş metal sıçraması, kısa süreli alev teması ve ark kaynaklı radyant ısı riskleri.',en:'Welding, cutting and allied hot-metal processes involving sparks, small molten-metal splashes, brief flame contact and radiant heat from welding arcs.'},markings:{tr:'EN ISO 11611 işaretini ve ürünün beyan edilen sınıf/performans bilgisini üretici teknik dokümanıyla birlikte doğrulayın; el, yüz, göz ve ayak koruması bu standardın tamamı tarafından karşılanmaz.',en:'Verify EN ISO 11611 marking and declared class/performance with manufacturer documentation; hand, face, eye and foot protection are not fully covered by this clothing standard.'}},
{slug:'en-iso-11612-heat-flame-protective-clothing',code:'EN ISO 11612',category:'Protective clothing',title:{tr:'Isı ve Aleve Karşı Koruyucu Giysi Standardı',en:'Protective Clothing Against Heat and Flame'},purpose:{tr:'EN ISO 11612, ısı ve/veya aleve karşı koruyucu giysiler için minimum performans gerekliliklerini kapsar. ISO 11612:2015 halen yayımlanmış güncel sürümdür; yeni sürüm final taslak aşamasındadır.',en:'EN ISO 11612 specifies minimum performance requirements for protective clothing against heat and/or flame. ISO 11612:2015 remains the published current edition while a new edition is at final-draft stage.'},use:{tr:'Sınırlı alev yayılımı ile birlikte radyant, konvektif veya temas ısısı ve belirli erimiş metal sıçraması riskleri bulunan endüstriyel işler.',en:'Industrial tasks requiring limited flame spread and protection against radiant, convective or contact heat and certain molten-metal splash hazards.'},markings:{tr:'EN ISO 11612 işaretini ve üreticinin beyan ettiği performans kodlarını doğrulayın; yalnız ürünün test edilip işaretlendiği ısı/alev riskleri için koruma kabul edin.',en:'Verify EN ISO 11612 marking and manufacturer-declared performance codes; only treat protection as valid for heat/flame hazards actually tested and marked on the product.'}},
{slug:'en-iso-20471-high-visibility-clothing',code:'EN ISO 20471',category:'Protective clothing',title:{tr:'Yüksek Görünürlüklü Koruyucu Giysi Standardı',en:'High Visibility Clothing Standard'},purpose:{tr:'EN ISO 20471:2013+A1:2016, kullanıcının araç ve mekanize ekipman operatörleri tarafından gündüz ve far ışığı altında karanlıkta fark edilebilirliğini artıran yüksek görünürlüklü giysiler için gereklilikleri kapsar. Mevcut sürüm halen geçerlidir ancak revizyon geliştirme aşamasındadır.',en:'EN ISO 20471:2013+A1:2016 specifies requirements for high-visibility clothing intended to make the wearer conspicuous to vehicle and mechanized-equipment operators in daylight and under headlights in darkness. The current edition remains valid while a revision is under development.'},use:{tr:'Trafik, yol çalışması, lojistik, saha araç hareketi ve düşük görünürlükte personel fark edilebilirliğinin kritik olduğu işler.',en:'Traffic, road work, logistics, vehicle-movement areas and tasks where wearer conspicuity is critical.'},markings:{tr:'EN ISO 20471 işaretini ve giysi sınıfını doğrulayın; görünürlük sınıfı giysinin floresan ve retroreflektif malzeme alanlarıyla ilişkilidir.',en:'Verify EN ISO 20471 marking and garment class; visibility class relates to the areas of fluorescent and retroreflective material.'}},
{slug:'en-iec-61482-2-electric-arc-clothing',code:'EN IEC 61482-2',category:'Protective clothing',title:{tr:'Elektrik Arkının Termal Tehlikelerine Karşı Koruyucu Giysi Standardı',en:'Protective Clothing Against Electric Arc Thermal Hazards'},purpose:{tr:'EN IEC 61482-2, elektrik arkı maruziyeti riski bulunan işlerde elektrik çalışanları için giysi ve malzemelerin arkın termal etkilerine karşı gerekliliklerini kapsar. Elektrik çarpması tehlikesini kapsamaz.',en:'EN IEC 61482-2 specifies requirements for materials and garments protecting electrical workers against the thermal hazards of an electric arc. It does not cover electric-shock hazards.'},use:{tr:'Ark flaşı/elektrik arkı termal riski bulunan canlı çalışma veya elektrik bakım faaliyetleri; kaynak işlemleri için kullanılmaz.',en:'Electrical maintenance or live-working situations with electric-arc thermal hazards; it is not a welding-clothing standard.'},markings:{tr:'EN IEC 61482-2 işaretini ve ürünün beyan edilen ark performansını doğrulayın; ark performansı elektrik çarpmasına karşı yalıtım anlamına gelmez.',en:'Verify EN IEC 61482-2 marking and the garment’s declared arc performance; arc performance does not mean electrical insulation against shock.'}},
{slug:'en-1149-5-electrostatic-protective-clothing',code:'EN 1149-5',category:'Protective clothing',title:{tr:'Elektrostatik Özellikli Koruyucu Giysi Standardı',en:'Electrostatic Protective Clothing Standard'},purpose:{tr:'EN 1149-5:2018, elektrostatik yük birikimini ve kıvılcım kaynaklı tutuşma riskini azaltmayı amaçlayan koruyucu giysiler için malzeme performansı ve tasarım gereklerini kapsar. Şebeke gerilimine karşı elektriksel koruma sağlamaz.',en:'EN 1149-5:2018 specifies material-performance and design requirements for electrostatic protective clothing intended to reduce electrostatic charge and spark-ignition risk. It does not provide protection against mains voltage.'},use:{tr:'Yanıcı atmosferlerde elektrostatik boşalmanın tutuşturucu kaynak olabileceği işler; uygun topraklama sistemiyle birlikte değerlendirilir.',en:'Work in flammable atmospheres where electrostatic discharge can become an ignition source, assessed together with an appropriate earthing system.'},markings:{tr:'EN 1149-5 işaretini ve üretici kullanım koşullarını doğrulayın; ayrı eldiven/ayakkabıların bu giysi standardı kapsamında otomatik olarak korunduğunu varsaymayın.',en:'Verify EN 1149-5 marking and manufacturer conditions of use; do not assume separate gloves or footwear are covered by this garment standard.'}},
{slug:'en-50365-electrically-insulating-helmets',code:'EN 50365',category:'Head protection',title:{tr:'Elektriksel Yalıtımlı Baret Standardı',en:'Electrically Insulating Helmet Standard'},purpose:{tr:'EN 50365:2023, alçak ve orta gerilim tesislerinde canlı çalışma için elektriksel yalıtımlı baretleri kapsar. Güncel Avrupa sürümü EN 50365:2023 ve 2024 düzeltmesidir.',en:'EN 50365:2023 covers electrically insulating helmets for live working on low- and medium-voltage installations. The current European edition includes the 2024 corrigendum.'},use:{tr:'Elektrik tesislerinde risk değerlendirmesinin yalıtımlı baş koruması gerektirdiği canlı çalışma veya yakın çalışma faaliyetleri.',en:'Live-working or proximity tasks on electrical installations where the risk assessment requires electrically insulating head protection.'},markings:{tr:'EN 50365 işaretini, üretici talimatlarını ve ürünün gerilim/uygulama sınırlarını doğrulayın; yalnız EN 397 işareti elektriksel yalıtım için yeterli kabul edilmez.',en:'Verify EN 50365 marking, manufacturer instructions and voltage/application limits; EN 397 marking alone is not sufficient evidence of electrical insulation.'}},
{slug:'en-60903-insulating-gloves-live-working',code:'EN 60903',category:'Hand protection',title:{tr:'Canlı Çalışma İçin Yalıtkan Eldiven Standardı',en:'Insulating Gloves for Live Working Standard'},purpose:{tr:'EN 60903, canlı çalışmada kullanılan yalıtkan eldiven ve mittenleri kapsar. Standart elektriksel koruma sağlayan yalıtkan eldivenleri ve elektriksel + mekanik korumayı birlikte sağlayan kompozit eldivenleri ayırır.',en:'EN 60903 covers insulating gloves and mitts for live working. It distinguishes insulating gloves providing electrical protection from composite gloves providing electrical and mechanical protection.'},use:{tr:'Canlı elektrik çalışmaları ve elektrik çarpması riskinin kontrolü için uygun sınıfta yalıtkan eldiven gereken faaliyetler.',en:'Live electrical work requiring insulating gloves of a suitable class to control electric-shock risk.'},markings:{tr:'EN 60903 işaretini, eldiven sınıfını, kategori/özel özellikleri ve periyodik test durumunu üretici talimatıyla birlikte kontrol edin.',en:'Check EN 60903 marking, glove class, category/special properties and periodic-test status together with manufacturer instructions.'}},
{slug:'en-136-full-face-masks',code:'EN 136',category:'Respiratory protection',title:{tr:'Tam Yüz Solunum Maskesi Standardı',en:'Full Face Mask Respiratory Standard'},purpose:{tr:'EN 136:1998, solunum koruyucu cihazlarda kullanılan tam yüz maskeleri için gereklilik, test ve işaretlemeyi kapsar. BSI kayıtlarında mevcut sürüm halen güncel ve inceleme altındadır.',en:'EN 136:1998 covers requirements, testing and marking for full face masks used in respiratory protective devices. BSI currently lists the edition as current and under review.'},use:{tr:'Uygun filtreli veya hava beslemeli solunum koruyucu sistemlerde tam yüz sızdırmazlığı ve göz/yüz kapsaması gereken işler.',en:'Respiratory-protection systems using suitable filters or supplied air where full-face sealing and eye/face coverage are required.'},markings:{tr:'EN 136 işaretini, üretici/model bilgisini, bağlantı tipini ve maskenin uyumlu filtre/solunum sistemiyle birlikte kullanım talimatlarını doğrulayın.',en:'Verify EN 136 marking, manufacturer/model, connection type and instructions for use with the compatible filter or breathing system.'}},'''
          insert_before(data, ']\nexport const getPPEStandard', data_block, "en-iso-21420-protective-gloves-general-requirements")

          tech_block=r'''
'EN ISO 21420':{product:T('Koruyucu eldiven – genel ürün gereklilikleri','Protective glove – general product requirements'),classes:[I('GENERAL','Genel gereklilik','General requirements','Tasarım, yapım, zararsızlık, konfor/verimlilik ve temel ürün bilgilerini kapsar; tek başına belirli bir tehlikeye karşı koruma seviyesi vermez.','Covers design, construction, innocuousness, comfort/efficiency and basic product information; it does not by itself define protection against a specific hazard.'),I('WITH SPECIFIC STANDARD','Risk standardıyla birlikte','With hazard-specific standard','EN 388, EN ISO 374, EN 407 gibi tehlikeye özgü standartlarla birlikte değerlendirilir.','Used together with hazard-specific standards such as EN 388, EN ISO 374 or EN 407.')],marks:[I('EN ISO 21420','Genel standart','General standard','Koruyucu eldivenlerin genel gerekleri.','General protective-glove requirements.'),I('SIZE','Beden','Size','Doğru beden ve ergonomik kullanım için ürün bedeni.','Product size for correct fit and ergonomic use.'),I('ID','Ürün kimliği','Product identity','Üretici/model ve izlenebilirlik bilgisi.','Manufacturer/model and traceability information.')],uses:[T('Genel el koruması seçimi','General hand-protection selection'),T('Mekanik risk eldivenleri','Mechanical-risk gloves'),T('Kimyasal eldivenler','Chemical gloves'),T('Termal eldivenler','Thermal gloves')],checks:[T('Üretici ve ürün kimliği okunur mu?','Are manufacturer and product identity legible?'),T('Beden ve el uyumu uygun mu?','Are size and hand fit suitable?'),T('Eldivende yırtık, delik veya ciddi deformasyon var mı?','Any tear, hole or major deformation?'),T('İşe özgü risk standardı ayrıca işaretli mı?','Is the task-specific hazard standard also marked?')],note:T('ISO 21420:2020, 2025 yılında yeniden teyit edilmiştir ve 2022 değişikliği yayımlanmıştır.','ISO 21420:2020 was reconfirmed in 2025 and has a published 2022 amendment.')},
'EN 407':{product:T('Isı/ateşe karşı koruyucu eldiven veya el koruyucu','Protective glove/hand protection against heat and/or fire'),classes:[I('1','Alev yayılımı','Flame spread','İlk performans konumu; ürünün alev davranışını ifade eder.','First performance position; indicates flame behaviour.'),I('2','Temas ısısı','Contact heat','İkinci performans konumu; sıcak yüzey temas performansını ifade eder.','Second position; indicates hot-surface contact performance.'),I('3-6','Diğer termal performanslar','Other thermal performances','Konvektif ısı, radyant ısı, küçük ve büyük erimiş metal sıçraması performansları.','Convective heat, radiant heat, small and large molten-metal splash performance.')],marks:[I('EN 407','Standart','Standard','Termal risklere karşı el koruması.','Hand protection against thermal risks.'),I('6-POSITION CODE','Performans kodu','Performance code','Altı konum; test edilmeyen/uygulanmayan alanlarda X görülebilir.','Six positions; X may appear where not tested/not applicable.'),I('EN ISO 21420','Genel gerekler','General requirements','EN 407:2020 ile birlikte genel eldiven gereklilikleri.','General glove requirements used together with EN 407:2020.')],uses:[T('Sıcak yüzey','Hot surfaces'),T('Alev riski','Flame risk'),T('Fırın / proses','Furnace / process work'),T('Erimiş metal riski','Molten-metal hazards')],checks:[T('Gerçek tehlike ile ilgili performans konumu test edilmiş mi?','Has the performance position relevant to the actual hazard been tested?'),T('Eldiven yanık, sertleşme veya termal hasar gösteriyor mu?','Any burn, hardening or thermal damage?'),T('Mekanik dayanım gerekiyorsa ayrıca doğrulandı mı?','If mechanical strength is needed, has it been verified separately?'),T('EN ISO 21420 ve üretici talimatı mevcut mu?','Are EN ISO 21420 and manufacturer instructions available?')],note:T('EN 407:2020 güncel Avrupa sürümüdür ve EN ISO 21420 ile birlikte uygulanır.','EN 407:2020 is the current European edition and is used together with EN ISO 21420.')},
'EN ISO 11611':{product:T('Kaynak ve benzeri prosesler için koruyucu giysi','Protective clothing for welding and allied processes'),classes:[I('CLASS 1','Daha düşük risk düzeyi','Lower hazard level','Standarttaki daha düşük proses/ısı maruziyet koşulları için ürün sınıfı; seçim gerçek proses riskine göre yapılır.','Garment class for lower process/heat exposure conditions; selection depends on the actual process hazard.'),I('CLASS 2','Daha yüksek risk düzeyi','Higher hazard level','Daha yüksek kaynak/proses ısıl ve sıçrama koşulları için daha yüksek koruma sınıfı.','Higher protection class for more severe welding/process thermal and spatter conditions.')],marks:[I('EN ISO 11611','Standart','Standard','Kaynak ve benzeri proses koruyucu giysi standardı.','Protective clothing standard for welding and allied processes.'),I('CLASS 1/2','Sınıf','Class','Ürünün beyan edilmiş performans sınıfı.','Declared garment performance class.'),I('ID','Ürün kimliği','Product identity','Üretici, model ve izlenebilirlik bilgisi.','Manufacturer, model and traceability information.')],uses:[T('Kaynak','Welding'),T('Termal kesme','Thermal cutting'),T('Metal imalat','Metal fabrication'),T('Bakım','Maintenance')],checks:[T('Giysi sınıfı proses riskine uygun mu?','Does garment class match the process hazard?'),T('Kumaşta delik, yanık veya yoğun kontaminasyon var mı?','Any holes, burns or heavy contamination?'),T('Giysi kapanışları kapalı ve örtüşmeler yeterli mi?','Are closures secured and overlaps adequate?'),T('Eldiven, yüz/göz ve ayak koruması ayrıca seçildi mi?','Have hand, face/eye and foot protection been selected separately?')],note:T('ISO 11611:2024 mevcut yayımlanmış ISO sürümüdür; sonraki revizyon geliştirme aşamasındadır.','ISO 11611:2024 is the current published ISO edition; a subsequent revision is under development.')},
'EN ISO 11612':{product:T('Isı ve aleve karşı koruyucu giysi','Protective clothing against heat and flame'),classes:[I('A','Sınırlı alev yayılımı','Limited flame spread','Giysinin alev yayılım performansı.','Garment limited-flame-spread performance.'),I('B/C/D/E/F','Isı/metal performansları','Heat/metal performances','Konvektif ısı, radyant ısı, erimiş alüminyum/demir ve temas ısısı gibi performans alanları üretici işaretine göre değerlendirilir.','Performance areas such as convective heat, radiant heat, molten aluminium/iron and contact heat are interpreted from manufacturer markings.')],marks:[I('EN ISO 11612','Standart','Standard','Isı ve aleve karşı koruyucu giysi standardı.','Protective clothing standard against heat and flame.'),I('A-F CODES','Performans kodları','Performance codes','Yalnız ürün üzerinde beyan edilen performanslar geçerlidir.','Only declared/marked performances are applicable.'),I('ID','Ürün kimliği','Product identity','Üretici/model ve izlenebilirlik.','Manufacturer/model and traceability.')],uses:[T('Petrokimya','Petrochemical'),T('Metal prosesi','Metal processing'),T('Fırın işleri','Furnace work'),T('Bakım','Maintenance')],checks:[T('İş riskine karşı gereken performans kodları ürün üzerinde var mı?','Are task-required performance codes marked on the product?'),T('Giyside yanık, delik veya kimyasal kontaminasyon var mı?','Any burns, holes or chemical contamination?'),T('Katmanlama üretici talimatına uygun mu?','Is layering consistent with manufacturer instructions?'),T('El/baş/ayak gibi diğer vücut bölgeleri ayrıca korunuyor mu?','Are other body areas such as hands/head/feet protected separately?')],note:T('ISO 11612:2015 halen yayımlanmış güncel sürümdür; yeni sürüm final taslak aşamasındadır.','ISO 11612:2015 remains the current published edition; a new edition is at final-draft stage.')},
'EN ISO 20471':{product:T('Yüksek görünürlüklü uyarı giysisi','High-visibility warning clothing'),classes:[I('CLASS 1','En düşük görünürlük alanı','Lowest visibility area','Standarttaki minimum floresan/retroreflektif malzeme alanı sınıfı.','Lowest minimum area class for fluorescent/retroreflective material.'),I('CLASS 2','Orta seviye','Intermediate level','Daha yüksek görünürlük malzemesi alanı gerektiren sınıf.','Class requiring a larger area of visibility materials.'),I('CLASS 3','En yüksek seviye','Highest level','En yüksek minimum görünürlük malzemesi alanını gerektiren sınıf.','Class requiring the highest minimum area of visibility materials.')],marks:[I('EN ISO 20471','Standart','Standard','Yüksek görünürlüklü giysi referansı.','High-visibility clothing reference.'),I('CLASS 1/2/3','Giysi sınıfı','Garment class','Floresan ve retroreflektif malzeme alanlarıyla ilişkili görünürlük sınıfı.','Visibility class linked to fluorescent and retroreflective material areas.'),I('ID','Ürün kimliği','Product identity','Üretici/model ve bakım talimatı.','Manufacturer/model and care instructions.')],uses:[T('Yol çalışması','Road work'),T('Lojistik','Logistics'),T('Saha araç trafiği','Site vehicle traffic'),T('Düşük görünürlük','Low visibility')],checks:[T('Giysi sınıfı saha riskine uygun mu?','Does garment class match site risk?'),T('Retroreflektif bantlar kesik, kopuk veya aşırı kirli mi?','Are retroreflective bands cut, detached or heavily soiled?'),T('Floresan kumaş solmuş veya görünürlüğünü kaybetmiş mi?','Has fluorescent fabric faded or lost conspicuity?'),T('Yıkama/bakım sınırları üretici talimatı içinde mi?','Are wash/care limits within manufacturer instructions?')],note:T('EN ISO 20471:2013+A1:2016 halen güncel yayımlanmış referanstır; revizyon geliştirme aşamasındadır.','EN ISO 20471:2013+A1:2016 remains the current published reference while a revision is under development.')},
'EN IEC 61482-2':{product:T('Elektrik arkının termal etkilerine karşı koruyucu giysi','Protective clothing against electric-arc thermal hazards'),classes:[I('ARC RATING','Ark derecesi','Arc rating','Üretici, uygun test yöntemine göre ATPV/EBT/ELIM gibi ark termal performans değerleri beyan edebilir.','Manufacturer may declare arc-thermal values such as ATPV/EBT/ELIM based on the applicable test method.'),I('APC','Ark koruma sınıfı','Arc protection class','Box-test yaklaşımına dayalı sınıf bilgisi üretici işaretine göre değerlendirilir.','Arc-protection class based on box-test methodology is interpreted from manufacturer marking.')],marks:[I('EN IEC 61482-2','Standart','Standard','Elektrik arkı termal tehlikelerine karşı giysi.','Garment protection against electric-arc thermal hazards.'),I('ATPV/EBT/ELIM','Ark performansı','Arc performance','Üretici beyanlı ark termal performans değerleri.','Manufacturer-declared arc-thermal performance values.'),I('ID','Ürün kimliği','Product identity','Üretici/model ve izlenebilirlik.','Manufacturer/model and traceability.')],uses:[T('Elektrik bakım','Electrical maintenance'),T('Şalt sahası','Switchgear areas'),T('Canlı çalışma','Live working'),T('Ark flaşı riski','Arc-flash hazards')],checks:[T('Ark performansı risk değerlendirmesindeki enerjiye uygun mu?','Does arc performance match the risk-assessed incident energy?'),T('Giysi hasarlı, kirli veya uygunsuz modifiye edilmiş mi?','Is the garment damaged, contaminated or improperly modified?'),T('Katmanlama sistemi üretici tarafından destekleniyor mu?','Is the layering system supported by the manufacturer?'),T('Elektrik çarpması için ayrıca uygun yalıtım/ek PPE seçildi mi?','Has separate suitable insulation/additional PPE been selected for electric-shock hazards?')],note:T('IEC 61482-2:2018 elektrik arkının termal tehlikelerini kapsar; elektrik çarpmasını kapsamaz ve kaynak giysisi standardı değildir.','IEC 61482-2:2018 covers thermal hazards of electric arc; it does not cover electric shock and is not a welding-clothing standard.')},
'EN 1149-5':{product:T('Elektrostatik özellikli koruyucu giysi','Electrostatic protective clothing'),classes:[I('DISSIPATIVE','Elektrostatik dağıtıcı yapı','Electrostatic dissipative construction','Giysi, uygun topraklama sistemiyle birlikte elektrostatik yük birikimini azaltacak şekilde tasarlanır.','Garment is designed to reduce electrostatic charge accumulation when used with an appropriate earthing system.'),I('LIMIT','Kapsam sınırı','Scope limit','Şebeke gerilimine karşı elektriksel koruma sağlamaz.','Does not provide protection against mains voltage.')],marks:[I('EN 1149-5','Standart','Standard','Elektrostatik koruyucu giysi tasarım/performance gereklilikleri.','Electrostatic protective clothing design/performance requirements.'),I('ID','Ürün kimliği','Product identity','Üretici/model ve kullanım talimatı.','Manufacturer/model and instructions for use.')],uses:[T('Yanıcı atmosfer','Flammable atmospheres'),T('Petrokimya','Petrochemical'),T('Solvent işlemleri','Solvent handling'),T('Proses alanı','Process areas')],checks:[T('Giysi üretici talimatına göre doğru şekilde topraklanıyor mu?','Is the garment earthed as required by manufacturer instructions?'),T('Giysi üzerinde uygunsuz yalıtkan ek/parça var mı?','Any unsuitable insulating attachment/layer on the garment?'),T('Oksijen zengin ortam gibi özel sınırlar değerlendirilmiş mi?','Have special limitations such as oxygen-enriched atmospheres been assessed?'),T('Eldiven ve ayakkabı için ayrı uygunluk kontrol edildi mi?','Have gloves and footwear been verified separately?')],note:T('EN 1149-5:2018 şebeke gerilimine karşı koruma sağlamaz; ayrı eldiven ve ayakkabıları otomatik olarak kapsamaz.','EN 1149-5:2018 does not protect against mains voltage and does not automatically cover separate gloves or footwear.')},
'EN 50365':{product:T('Elektriksel yalıtımlı koruyucu baret','Electrically insulating protective helmet'),classes:[I('INSULATING','Elektriksel yalıtım','Electrical insulation','Canlı çalışma için baretin elektriksel yalıtım performansı, üretici beyan edilen uygulama sınırları içinde kullanılır.','Helmet electrical-insulation performance is used within manufacturer-declared live-working application limits.'),I('NOT EN 397 ALONE','EN 397 tek başına yeterli değil','EN 397 alone is not enough','Endüstriyel baret standardı işareti elektriksel yalıtım için tek başına yeterli değildir.','Industrial helmet marking alone is not sufficient evidence of electrical insulation.')],marks:[I('EN 50365','Standart','Standard','Canlı çalışma için elektriksel yalıtımlı baret referansı.','Electrically insulating helmet reference for live working.'),I('ID','Ürün kimliği','Product identity','Üretici, model ve izlenebilirlik bilgisi.','Manufacturer, model and traceability information.'),I('LIMITS','Uygulama sınırları','Application limits','Üreticinin gerilim/çevre/kullanım sınırlamaları.','Manufacturer voltage/environment/use limitations.')],uses:[T('Elektrik tesisleri','Electrical installations'),T('Şalt','Switchgear'),T('Canlı çalışma','Live working'),T('Yakın çalışma','Proximity work')],checks:[T('Kabukta çatlak, delinme veya yüzey kontaminasyonu var mı?','Any crack, puncture or surface contamination?'),T('EN 50365 işareti ve üretici sınırları okunur mu?','Are EN 50365 marking and manufacturer limits legible?'),T('Baret temiz/kuru ve üretici talimatına uygun mu?','Is the helmet clean/dry and within manufacturer instructions?'),T('İş için gereken diğer elektriksel PPE ayrıca seçilmiş mi?','Has other electrical PPE required for the task been selected separately?')],note:T('EN 50365:2023 güncel Avrupa sürümüdür; 2024 düzeltmesi yayımlanmıştır.','EN 50365:2023 is the current European edition and has a published 2024 corrigendum.')},
'EN 60903':{product:T('Canlı çalışma için yalıtkan veya kompozit eldiven','Insulating or composite glove for live working'),classes:[I('INSULATING','Yalıtkan eldiven','Insulating glove','Elektriksel koruma sağlar; mekanik koruma için genellikle uygun üst eldiven düzeni gerekebilir.','Provides electrical protection; a suitable protector over-glove arrangement may normally be required for mechanical protection.'),I('COMPOSITE','Kompozit eldiven','Composite glove','Elektriksel ve mekanik koruma performanslarını birlikte sağlayan ürün tipidir.','Product type combining electrical and mechanical protection.')],marks:[I('EN 60903','Standart','Standard','Canlı çalışma yalıtkan eldiven referansı.','Live-working insulating glove reference.'),I('CLASS','Elektrik sınıfı','Electrical class','İşin gerilim/risk değerlendirmesine göre uygun sınıf seçilir.','Appropriate class is selected from voltage/risk assessment.'),I('DATE/TEST','Test durumu','Test status','Periyodik elektriksel test/servis durumu üretici ve saha prosedürüne göre izlenir.','Periodic electrical test/service status is tracked per manufacturer and site procedure.')],uses:[T('Canlı elektrik işi','Live electrical work'),T('Şalt bakımı','Switchgear maintenance'),T('Elektrik izolasyon kontrolü','Electrical isolation verification')],checks:[T('Eldivende delik, kesik, çatlak veya ozon hasarı var mı?','Any hole, cut, crack or ozone damage?'),T('Sınıf işe uygun mu?','Is class suitable for the task?'),T('Periyodik test tarihi/servis durumu geçerli mi?','Is periodic-test/service status valid?'),T('Gerekiyorsa mekanik üst eldiven doğru kullanılıyor mu?','Where required, is the mechanical protector over-glove used correctly?')],note:T('BS EN 60903:2003 BSI tarafından current/under review olarak listelenmektedir; saha kullanımı üretici ve yerel elektrik güvenliği prosedürleriyle birlikte yönetilmelidir.','BS EN 60903:2003 is listed by BSI as current/under review; field use must also follow manufacturer and local electrical-safety procedures.')},
'EN 136':{product:T('Solunum koruyucu cihaz için tam yüz maskesi','Full face mask for respiratory protective devices'),classes:[I('FULL FACE','Tam yüz sızdırmazlığı','Full-face seal','Yüz, göz ve solunum bağlantısını tek maskede kapsayan yüz parçası.','Facepiece covering face/eyes and respiratory connection in one full-face mask.'),I('SYSTEM','Sistem bileşeni','System component','Koruma seviyesi yalnız maskeden değil, uyumlu filtre veya hava besleme sistemiyle birlikte oluşur.','Protection depends on the mask together with a compatible filter or supplied-air system.')],marks:[I('EN 136','Standart','Standard','Tam yüz maskesi gereklilik, test ve işaretleme standardı.','Full-face-mask requirements, testing and marking standard.'),I('MODEL/ID','Model kimliği','Model identity','Üretici/model ve izlenebilirlik bilgisi.','Manufacturer/model and traceability information.'),I('CONNECTION','Bağlantı','Connection','Uyumlu filtre veya solunum sistemi bağlantısı.','Connection for compatible filter or breathing system.')],uses:[T('Kimyasal proses','Chemical process'),T('Acil müdahale','Emergency response'),T('Filtreli solunum koruması','Filtered respiratory protection'),T('Hava beslemeli sistemler','Supplied-air systems')],checks:[T('Yüz contası temiz ve hasarsız mı?','Is the face seal clean and undamaged?'),T('Vizör çizik/çatlak veya görüşü etkileyen hasar içeriyor mu?','Any visor scratch/crack affecting vision?'),T('Valfler temiz ve çalışır durumda mı?','Are valves clean and functional?'),T('Filtre/sistem bağlantısı uyumlu ve doğru mu?','Is filter/system connection compatible and correct?'),T('Fit test ve kullanıcı uyumu sahadaki programa göre güncel mi?','Are fit testing and wearer suitability current under the site program?')],note:T('EN 136:1998 BSI tarafından current/under review olarak listelenmektedir; gerçek koruma maskenin uyumlu filtre veya solunum sistemiyle birlikte seçimine bağlıdır.','EN 136:1998 is listed by BSI as current/under review; actual protection depends on correct selection with the compatible filter or breathing system.')},'''
