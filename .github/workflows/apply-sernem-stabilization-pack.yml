name: Apply SERNEM Stabilization Pack

on:
  push:
    branches:
      - chore/sernem-stabilization-pack-v2
    paths:
      - ".github/workflows/apply-sernem-stabilization-pack.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/sernem-stabilization-pack-v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply targeted fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Standard Toolbox PDF: login required, but standard download remains free.
          p = Path('app/app/api/toolbox/[slug]/pdf/route.ts')
          s = p.read_text(encoding='utf-8')
          block = '''    if (\n      premiumMasterSlugSet.has(slug) &&\n      profile.plan !== "premium" &&\n      profile.role !== "admin"\n    ) {\n      return Response.redirect(\n        new URL(`/${locale}/upgrade`, request.url),\n        307,\n      );\n    }\n\n'''
          if block not in s:
              raise SystemExit('Standard PDF premium gate block not found')
          s = s.replace(block, '', 1)
          s = s.replace('import { premiumMasterSlugSet } from "@/lib/toolbox/premium-master-slugs";\n', '', 1)
          p.write_text(s, encoding='utf-8')

          # 2) Premium Toolbox route: force the same V2 four-page generator in every dynamic path.
          p = Path('app/app/api/premium/toolbox/[slug]/route.ts')
          s = p.read_text(encoding='utf-8')
          old = 'import { generatePremiumToolboxPdf } from "@/lib/pdf/premium-toolbox-pdf";'
          new = 'import { generatePremiumToolboxPdf } from "@/lib/pdf/premium-toolbox-pdf-v2";'
          if old not in s:
              raise SystemExit('Premium legacy generator import not found')
          s = s.replace(old, new, 1)
          s = s.replace('Toolbox verisinden tamamen yeni 3 sayfalık şirket PDF\'i üretilir.', 'Toolbox verisinden tamamen yeni 4 sayfalık şirket PDF\'i üretilir.')
          p.write_text(s, encoding='utf-8')

          # 3) Premium Word download: log the download in the same activity table.
          p = Path('app/app/api/premium/toolbox/[slug]/word/route.ts')
          s = p.read_text(encoding='utf-8')
          needle = '''  const buffer = await Packer.toBuffer(document);\n  const filename = `${slug}-toolbox-talk-${locale}-premium.docx`;\n'''
          replacement = '''  const buffer = await Packer.toBuffer(document);\n\n  const { error: activityError } = await supabase\n    .from("user_activity_events")\n    .insert({\n      user_id: user.id,\n      event_name: "word_download",\n      path: request.url,\n      metadata: {\n        resource_type: "toolbox",\n        slug,\n        locale,\n        mode: "premium_word",\n      },\n    });\n\n  if (activityError) {\n    console.error("Word activity tracking error:", activityError);\n  }\n\n  const filename = `${slug}-toolbox-talk-${locale}-premium.docx`;\n'''
          if needle not in s:
              raise SystemExit('Word buffer/filename anchor not found')
          s = s.replace(needle, replacement, 1)
          p.write_text(s, encoding='utf-8')

          # 4) Safety Sign downloads: log A4/A3/PNG after a successful client-side export.
          p = Path('app/components/safety-signs/SignDownloadButtons.tsx')
          s = p.read_text(encoding='utf-8')
          import_anchor = 'import { requirePrintAuth } from "@/lib/auth/require-print-auth";\n'
          if 'import { createClient } from "@/utils/supabase/client";' not in s:
              s = s.replace(import_anchor, import_anchor + 'import { createClient } from "@/utils/supabase/client";\n', 1)
          run_anchor = '''      if (type === "png") {\n        await downloadPNG();\n      } else {\n        await downloadPDF(type);\n      }\n'''
          run_replacement = '''      if (type === "png") {\n        await downloadPNG();\n      } else {\n        await downloadPDF(type);\n      }\n\n      const supabase = createClient();\n      const { data: { user } } = await supabase.auth.getUser();\n      if (user) {\n        const { error: activityError } = await supabase\n          .from("user_activity_events")\n          .insert({\n            user_id: user.id,\n            event_name: "safety_sign_download",\n            path: window.location.href,\n            metadata: {\n              resource_type: "safety_sign",\n              sign_code: signCode,\n              locale: resolvedLocale,\n              format: type,\n            },\n          });\n        if (activityError) {\n          console.error("Safety sign activity tracking error:", activityError);\n        }\n      }\n'''
          if run_anchor not in s:
              raise SystemExit('Safety sign run anchor not found')
          s = s.replace(run_anchor, run_replacement, 1)
          p.write_text(s, encoding='utf-8')

          # 5) Poster printing: keep preview public, but log authenticated print/download intent.
          p = Path('app/components/posters-v4/PosterFormatToolbar.tsx')
          s = p.read_text(encoding='utf-8')
          print_anchor = '    window.print();\n'
          print_replacement = '''    window.print();\n\n    try {\n      const supabase = createClient();\n      const { data: { user } } = await supabase.auth.getUser();\n      if (user) {\n        const { error: activityError } = await supabase\n          .from("user_activity_events")\n          .insert({\n            user_id: user.id,\n            event_name: "poster_print",\n            path: window.location.href,\n            metadata: {\n              resource_type: "poster",\n              size: selectedSize,\n              mode: brandedPoster ? "branded" : "standard",\n              locale,\n            },\n          });\n        if (activityError) {\n          console.error("Poster activity tracking error:", activityError);\n        }\n      }\n    } catch (error) {\n      console.error("Poster activity tracking failed:", error);\n    }\n'''
          if print_anchor not in s:
              raise SystemExit('Poster print anchor not found')
          s = s.replace(print_anchor, print_replacement, 1)
          p.write_text(s, encoding='utf-8')

          # 6) Static guard for the critical download/auth architecture.
          qa = r'''import { readFile } from "node:fs/promises";\n\nconst checks = [\n  {\n    file: "app/api/toolbox/[slug]/pdf/route.ts",\n    mustContain: [\n      "getCurrentAccessProfile()",\n      'event_name: "pdf_download"',\n      'mode: "standard"',\n    ],\n    mustNotContain: ["premiumMasterSlugSet.has(slug)"],\n  },\n  {\n    file: "app/api/premium/toolbox/[slug]/route.ts",\n    mustContain: [\n      'premium-toolbox-pdf-v2',\n      'event_name: "pdf_download"',\n    ],\n    mustNotContain: ['premium-toolbox-pdf";'],\n  },\n  {\n    file: "app/api/premium/toolbox/[slug]/word/route.ts",\n    mustContain: [\n      'event_name: "word_download"',\n      'mode: "premium_word"',\n    ],\n  },\n  {\n    file: "components/safety-signs/SignDownloadButtons.tsx",\n    mustContain: [\n      "requirePrintAuth",\n      'event_name: "safety_sign_download"',\n    ],\n  },\n  {\n    file: "components/posters-v4/PosterFormatToolbar.tsx",\n    mustContain: [\n      "requirePrintAuth",\n      'event_name: "poster_print"',\n    ],\n  },\n];\n\nlet failed = false;\nfor (const check of checks) {\n  const text = await readFile(new URL(`../${check.file}`, import.meta.url), "utf8");\n  for (const token of check.mustContain ?? []) {\n    if (!text.includes(token)) {\n      console.error(`FAIL ${check.file}: missing ${token}`);\n      failed = true;\n    }\n  }\n  for (const token of check.mustNotContain ?? []) {\n    if (text.includes(token)) {\n      console.error(`FAIL ${check.file}: forbidden ${token}`);\n      failed = true;\n    }\n  }\n}\n\nif (failed) process.exit(1);\nconsole.log("SERNEM download/auth QA: PASS");\n'''
          Path('app/scripts/qa-download-flows.mjs').write_text(qa.replace('\\n', '\n'), encoding='utf-8')

          # 7) Run the new guard in prebuild and expose it manually.
          p = Path('app/package.json')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '"prebuild": "node scripts/polish-toolbox-pdfs.mjs && node scripts/qa-toolbox-pdfs.mjs",',
              '"prebuild": "node scripts/polish-toolbox-pdfs.mjs && node scripts/qa-toolbox-pdfs.mjs && node scripts/qa-download-flows.mjs",',
              1,
          )
          if '"qa:download-flows"' not in s:
              s = s.replace(
                  '"qa:toolbox-pdfs": "node scripts/qa-toolbox-pdfs.mjs",',
                  '"qa:toolbox-pdfs": "node scripts/qa-toolbox-pdfs.mjs",\n    "qa:download-flows": "node scripts/qa-download-flows.mjs",',
                  1,
              )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Run download flow QA
        working-directory: app
        run: npm run qa:download-flows

      - name: Run Toolbox PDF QA
        working-directory: app
        run: npm run qa:toolbox-pdfs

      - name: Build
        working-directory: app
        run: npm run build

      - name: Commit stabilization changes
        run: |
          git config user.name "safebaseapp"
          git config user.email "aslansercann@gmail.com"
          git add app/app/api/toolbox/[slug]/pdf/route.ts \
            app/app/api/premium/toolbox/[slug]/route.ts \
            app/app/api/premium/toolbox/[slug]/word/route.ts \
            app/components/safety-signs/SignDownloadButtons.tsx \
            app/components/posters-v4/PosterFormatToolbar.tsx \
            app/scripts/qa-download-flows.mjs \
            app/package.json app/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: stabilize download auth and activity tracking"
          git push origin HEAD:chore/sernem-stabilization-pack-v2
