name: Run PPE expansion

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply PPE expansion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/expand-ppe-standards.yml').read_text()
          start="python3 - <<'PY'\n"
          code=s.split(start,1)[1].split("\n          PY",1)[0]
          lines=[]
          for line in code.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          code='\n'.join(lines)
          code=code.replace("insert_before(data, ']\\n", "insert_before(data, '];\\n")
          exec(code, {})
          PY
      - name: Build
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Commit expanded PPE library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/app/'[locale]'/ppe-standards
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "expand PPE standards library from 10 to 20"
          git push
