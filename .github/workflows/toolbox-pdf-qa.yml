name: Toolbox PDF QA

on:
  push:
    branches:
      - chore/toolbox-pdf-qa
    paths:
      - "app/public/downloads/**"
      - "app/lib/toolbox/premium-master-slugs.ts"
      - "app/scripts/qa-toolbox-pdfs.mjs"
      - "app/package.json"
      - ".github/workflows/toolbox-pdf-qa.yml"
  pull_request:
    paths:
      - "app/public/downloads/**"
      - "app/lib/toolbox/premium-master-slugs.ts"
      - "app/scripts/qa-toolbox-pdfs.mjs"
      - "app/package.json"
      - ".github/workflows/toolbox-pdf-qa.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit Toolbox PDFs
        id: audit
        continue-on-error: true
        run: npm run qa:toolbox-pdfs

      - name: Upload Eye Face QA samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eye-face-pdf-qa
          path: |
            app/public/downloads/eye-face-protection-toolbox-talk-en-branded-base.pdf
            app/public/downloads/eye-face-protection-toolbox-talk-tr-branded-base.pdf
          if-no-files-found: error

      - name: Fail when audit failed
        if: steps.audit.outcome == 'failure'
        run: exit 1
