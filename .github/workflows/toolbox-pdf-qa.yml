name: Toolbox PDF QA

on:
  push:
    branches:
      - main
    paths:
      - "app/public/downloads/**"
      - "app/lib/toolbox/premium-master-slugs.ts"
      - "app/scripts/qa-toolbox-pdfs.mjs"
      - "app/package.json"
      - ".github/workflows/toolbox-pdf-qa.yml"
  pull_request:
    paths:
      - "app/public/downloads/**"
      - "app/lib/toolbox/premium-master-slugs.ts"
      - "app/scripts/qa-toolbox-pdfs.mjs"
      - "app/package.json"
      - ".github/workflows/toolbox-pdf-qa.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit Toolbox PDFs
        run: npm run qa:toolbox-pdfs
