name: Toolbox PDF QA

on:
  push:
    branches:
      - main
    paths:
      - "app/public/downloads/**"
      - "app/lib/toolbox/toolbox-data.ts"
      - "app/app/[locale]/toolbox/ToolboxLibraryClient.tsx"
      - "app/lib/pdf/premium-toolbox-pdf-v2.ts"
      - "app/lib/pdf/premium-toolbox-pdf.ts"
      - "app/scripts/qa-toolbox-content.mjs"
      - "app/scripts/qa-toolbox-dynamic-pdf-render.mjs"
      - "app/lib/toolbox/premium-master-slugs.ts"
      - "app/scripts/qa-toolbox-pdfs.mjs"
      - "app/package.json"
      - ".github/workflows/toolbox-pdf-qa.yml"
  pull_request:
    paths:
      - "app/public/downloads/**"
      - "app/lib/toolbox/toolbox-data.ts"
      - "app/app/[locale]/toolbox/ToolboxLibraryClient.tsx"
      - "app/lib/pdf/premium-toolbox-pdf-v2.ts"
      - "app/lib/pdf/premium-toolbox-pdf.ts"
      - "app/scripts/qa-toolbox-content.mjs"
      - "app/scripts/qa-toolbox-dynamic-pdf-render.mjs"
      - "app/lib/toolbox/premium-master-slugs.ts"
      - "app/scripts/qa-toolbox-pdfs.mjs"
      - "app/package.json"
      - ".github/workflows/toolbox-pdf-qa.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit Toolbox PDFs
        run: npm run qa:toolbox-pdfs

      - name: Audit Toolbox bilingual catalogue
        run: npm run qa:toolbox-content

      - name: Render 60 new Toolbox PDFs
        run: npm run qa:toolbox-dynamic-pdfs

      - name: Upload PDF print-review samples
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: toolbox-print-review-samples
          path: app/toolbox-pdf-qa-samples/*.pdf
          retention-days: 7
