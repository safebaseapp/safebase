name: SERNEM TR-EN Content Integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bilingual-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check bilingual content integrity
        run: node app/scripts/i18n-quality-check.mjs
