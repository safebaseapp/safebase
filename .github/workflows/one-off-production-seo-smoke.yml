name: One-off production SEO smoke

on:
  push:
    branches:
      - seo/canonical-hreflang
    paths:
      - ".github/workflows/one-off-production-seo-smoke.yml"
  workflow_dispatch:

jobs:
  production-seo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect production SEO link markup
        run: |
          python - <<'PY'
          import re
          import urllib.request

          BASE='https://www.sernem.com'
          UA='SERNEM-Production-SEO-QA/1.0'

          def fetch(path):
              req=urllib.request.Request(BASE+path, headers={'User-Agent':UA})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.getcode(), r.geturl(), r.read().decode('utf-8','ignore')

          status, final, html=fetch('/en')
          print('STATUS', status, final)
          for tag in re.findall(r'<link\b[^>]*>', html, flags=re.I):
              low=tag.lower()
              if 'canonical' in low or 'alternate' in low or 'lang' in low:
                  print(tag)

          print('--- raw language markers ---')
          for marker in ['hreflang', 'hrefLang', 'x-default', 'https://www.sernem.com/tr']:
              print(marker, html.find(marker))
          PY
