name: SIM5 White Tank Real Scene Capture

on:
  push:
    branches:
      - fix/sim5-modern-white-tank-showcase-20261020
    paths:
      - "app/app/[locale]/labs/sim5/RealModels.tsx"
      - "tools/sim5-review/capture-modern-tank-showcase.mjs"
      - ".github/workflows/sim5-white-tank-capture.yml"

permissions:
  contents: write

concurrency:
  group: sim5-white-tank-capture
  cancel-in-progress: false

jobs:
  capture:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out the isolated feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned app and review dependencies without lifecycle scripts
        run: |
          npm ci --prefix app --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/sim5-review --ignore-scripts --no-audit --no-fund

      - name: Install headless Chromium and its libraries
        run: npx --prefix tools/sim5-review playwright install --with-deps chromium

      - name: Capture real white storage-tank 3D scene
        run: node tools/sim5-review/capture-modern-tank-showcase.mjs

      - name: Verify artwork and commit it to this feature branch only
        run: |
          test -s app/public/images/sim5-site-showcase.webp
          test -s docs/sim5-white-tank-review/provenance.json
          node -e 'const fs=require("fs"); const s=JSON.parse(fs.readFileSync("docs/sim5-white-tank-review/provenance.json")); if(s.tankFinish!=="modern white coated steel"||!s.coatingReport.materials.includes("SIM5_Modern_White_Tank_Large_tank"))process.exit(1); console.log("White storage tank scene verified:",s.sha256);'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/images/sim5-site-showcase.webp docs/sim5-white-tank-review/provenance.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(sim5): refresh real white tank marketing render [skip ci]"
            git push origin HEAD:fix/sim5-modern-white-tank-showcase-20261020
          fi
