name: Install approved EN 795 anchor visual
on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-sernem-en795.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install approved image
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 120 'https://at.adobe.com/aLpf5d9nRuyVGvs9' -o /tmp/en795.png
          python3 -m pip install --quiet --user Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re
          img=Image.open('/tmp/en795.png').convert('RGB')
          assert img.width>=1000 and img.height>=700
          out=Path('app/public/ppe-standards/approved/en-795.webp')
          out.parent.mkdir(parents=True,exist_ok=True)
          img.save(out,'WEBP',quality=87,method=6)
          assert out.stat().st_size>20000
          path=Path('app/app/[locale]/ppe-standards/visual-data.ts')
          lines=path.read_text().splitlines(keepends=True)
          hits=[i for i,x in enumerate(lines) if x.lstrip().startswith("'EN 795':")]
          assert len(hits)==1
          i=hits[0]
          name="'/ppe-standards/approved/en-795.webp'"
          row,n=re.subn(r"photo:(?:'[^']+'|[0-9]+)",'photo:'+name,lines[i],count=1)
          assert n==1
          row,n=re.subn(r"scenes:\[[^\]]*\]",'scenes:['+name+']',row,count=1)
          assert n==1
          row,n=re.subn(r'alt:\{tr:"[^"]*",en:"[^"]*"\}',"alt:{tr:'Ankraj cihazı bağlantısı; SERNEM özgün temsili HSE görseli, sertifika kanıtı değildir',en:'Fall protection anchor attachment; original SERNEM illustration, not certification evidence'}",row,count=1)
          assert n==1
          lines[i]=row
          path.write_text(''.join(lines))
          PY
      - name: Commit approved image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/public/ppe-standards/approved/en-795.webp 'app/app/[locale]/ppe-standards/visual-data.ts'
          git diff --cached --quiet && exit 0
          git commit -m 'feat(ppe): install approved original EN 795 anchor illustration'
          git push
