name: Finalize SERNEM Stabilization Events

on:
  push:
    branches:
      - chore/sernem-stabilization-pack-v2
    paths:
      - ".github/workflows/finalize-sernem-stabilization-events.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/sernem-stabilization-pack-v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Standardize activity event names for Dashboard
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            'app/app/api/toolbox/[slug]/pdf/route.ts': [
              ('event_name: "pdf_download",', 'event_name: "resource_download||PDF",')
            ],
            'app/app/api/premium/toolbox/[slug]/route.ts': [
              ('event_name: "pdf_download",', 'event_name: "resource_download||PDF",')
            ],
            'app/app/api/premium/toolbox/[slug]/word/route.ts': [
              ('event_name: "word_download",', 'event_name: `resource_download|${title}|DOCX`,')
            ],
            'app/components/safety-signs/SignDownloadButtons.tsx': [
              ('event_name: "safety_sign_download",', 'event_name: `resource_download|${signTitle}|${type.toUpperCase()}`,')
            ],
            'app/components/posters-v4/PosterFormatToolbar.tsx': [
              ('event_name: "poster_print",', 'event_name: "resource_download|Poster|PDF",')
            ],
          }

          for name, reps in replacements.items():
            p = Path(name)
            s = p.read_text(encoding='utf-8')
            for old, new in reps:
              if old not in s:
                raise SystemExit(f'Missing event anchor in {name}: {old}')
              s = s.replace(old, new)
            p.write_text(s, encoding='utf-8')

          p = Path('app/scripts/qa-download-flows.mjs')
          s = p.read_text(encoding='utf-8')
          s = s.replace('event_name: "pdf_download"', 'resource_download|')
          s = s.replace('event_name: "word_download"', 'resource_download|')
          s = s.replace('event_name: "safety_sign_download"', 'resource_download|')
          s = s.replace('event_name: "poster_print"', 'resource_download|')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Run download flow QA
        working-directory: app
        run: npm run qa:download-flows

      - name: Run Toolbox PDF QA
        working-directory: app
        run: npm run qa:toolbox-pdfs

      - name: Build
        working-directory: app
        run: npm run build

      - name: Commit final event standardization
        run: |
          git config user.name "safebaseapp"
          git config user.email "aslansercann@gmail.com"
          git add app/app/api/toolbox/[slug]/pdf/route.ts \
            app/app/api/premium/toolbox/[slug]/route.ts \
            app/app/api/premium/toolbox/[slug]/word/route.ts \
            app/components/safety-signs/SignDownloadButtons.tsx \
            app/components/posters-v4/PosterFormatToolbar.tsx \
            app/scripts/qa-download-flows.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: expose download events in user dashboard"
          git push origin HEAD:chore/sernem-stabilization-pack-v2
