name: Install approved PPE package 4
on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-sernem-ppe-paket4.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Download approved images
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 120 'https://at.adobe.com/ZKCURD4ZPpnEL0eR' -o /tmp/ppe4.zip
          unzip -t /tmp/ppe4.zip
          unzip -o /tmp/ppe4.zip -d app/public
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/app/[locale]/ppe-standards/visual-data.ts')
          s=p.read_text()
          for code in ['EN ISO 13688','EN 343','EN 13034','EN 14605','EN ISO 13982-1']:
              slug=code.lower().replace(' ','-')
              f=Path('app/public/ppe-standards/approved')/(slug+'.webp')
              assert f.is_file() and f.stat().st_size>10000, f
              lines=s.splitlines(keepends=True)
              indices=[i for i,x in enumerate(lines) if x.lstrip().startswith("'"+code+"':")]
              assert len(indices)==1,code
              i=indices[0]; row=lines[i]
              img="'/ppe-standards/approved/"+slug+".webp'"
              row,n=re.subn(r"photo:(?:'[^']+'|[0-9]+)","photo:"+img,row,count=1)
              assert n==1
              row,n=re.subn(r"scenes:\[[^\]]*\]","scenes:["+img+"]",row,count=1)
              assert n==1
              lines[i]=row;s=''.join(lines)
          p.write_text(s)
          PY
      - name: Commit images and mapping
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/public/ppe-standards/approved 'app/app/[locale]/ppe-standards/visual-data.ts'
          git diff --cached --quiet && exit 0
          git commit -m 'feat(ppe): approved package 4 protective clothing visuals'
          git push
