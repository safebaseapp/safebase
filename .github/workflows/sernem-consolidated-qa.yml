name: SERNEM Unified Release QA

on:
  push:
    branches:
      - release/sernem-consolidated-qa-20261102
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-entitlement-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the exact QA branch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install application dependencies
        run: npm ci --prefix app --no-audit --no-fund
      - name: Install read-only QA fixture dependencies
        run: npm ci --prefix tools/sim5-review --no-audit --no-fund
      - name: TypeScript check (combined code)
        run: ./app/node_modules/.bin/tsc --noEmit --project app/tsconfig.json
      - name: Existing toolbox/download/poster source regressions
        run: npm run prebuild --prefix app
      - name: Safety Signs API access fixtures
        run: node tools/safety-signs-pack/access-audit.mjs
      - name: Billing trial expiry and cancellation fixtures
        run: node tools/safety-signs-pack/billing-audit.mjs
